<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Medios | Cerveza Águila</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header glass-panel">
            <div class="logo">
                <h1>Informe de Medios</h1>
                <span class="badge">Cerveza Águila</span>
            </div>
            <p class="subtitle">Resumen de Campaña Deportiva</p>
        </header>

        <main>
            <section class="overview-section" id="overview">
                <!-- Overview metrics injected via JS -->
            </section>

            <section class="events-section" id="events-container">
                <!-- Events injected via JS -->
            </section>
        </main>
    </div>

    <!-- Modal for images -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modal-img" src="" alt="Captura ampliada">
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
