<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informe de Medios | Cerveza Águila</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --bg-color: #f8f9fa;
    --surface-color: #ffffff;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --accent-color: #ffc107; /* Aguila Yellow */
    --accent-hover: #ffb300;
    --border-color: #e5e5ea;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 24px rgba(0,0,0,0.12);
    --radius-md: 12px;
    --radius-lg: 20px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

.app-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

.glass-panel {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    border-radius: var(--radius-lg);
    margin-bottom: 2rem;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 1rem;
    z-index: 100;
}

.header .logo h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.badge {
    display: inline-block;
    background-color: var(--accent-color);
    color: #000;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    margin-top: 0.25rem;
    text-transform: uppercase;
}

.subtitle {
    color: var(--text-secondary);
    font-weight: 500;
}

/* Overview Section */
.overview-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    margin-bottom: 3rem;
}

.metric-card {
    background-color: var(--surface-color);
    padding: 1.5rem;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.metric-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
}

.metric-title {
    font-size: 0.875rem;
    color: var(--text-secondary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
}

.metric-value {
    font-size: 2.25rem;
    font-weight: 700;
    letter-spacing: -1px;
}

/* Events Section */
.event-block {
    margin-bottom: 4rem;
}

.event-header {
    margin-bottom: 1.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}

.event-title {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.event-date {
    color: var(--text-secondary);
    font-weight: 500;
}

.posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 1.5rem;
}

.post-card {
    background-color: var(--surface-color);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
}

.post-header {
    padding: 1.5rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border-color);
}

.post-medium {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
}

.post-action {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.post-link {
    display: inline-block;
    margin-top: 0.75rem;
    font-size: 0.875rem;
    color: #0066cc;
    text-decoration: none;
    font-weight: 500;
}

.post-link:hover {
    text-decoration: underline;
}

.post-body {
    padding: 1.5rem;
    flex-grow: 1;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.stat-item {
    display: flex;
    flex-direction: column;
}

.stat-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    font-weight: 600;
}

.stat-value {
    font-size: 1.125rem;
    font-weight: 600;
}

/* Gallery inside post card */
.post-gallery {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    scrollbar-width: thin;
}

.post-gallery::-webkit-scrollbar {
    height: 6px;
}
.post-gallery::-webkit-scrollbar-thumb {
    background-color: #ccc;
    border-radius: 10px;
}

.gallery-img {
    height: 80px;
    width: auto;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--border-color);
    transition: opacity 0.2s;
}

.gallery-img:hover {
    opacity: 0.8;
}

/* Modal */
.modal {
    display: none; 
    position: fixed; 
    z-index: 1000; 
    left: 0;
    top: 0;
    width: 100%; 
    height: 100%; 
    overflow: auto; 
    background-color: rgba(0,0,0,0.8); 
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

.modal-content {
    margin: auto;
    display: block;
    max-width: 90%;
    max-height: 90%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

#modal-img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.close-modal {
    position: absolute;
    top: -40px;
    right: 0;
    color: #f1f1f1;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
}

@media (max-width: 768px) {
    .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
    }
    .overview-section {
        grid-template-columns: 1fr 1fr;
    }
}

    </style>
</head>

        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modal-img" src="" alt="Captura ampliada">
        </div>
    </div>

document.addEventListener('DOMContentLoaded', () => {
    // The data is now available in the global reportData variable from data.js
    if (typeof reportData !== 'undefined') {
        renderOverview(reportData.totals);
        renderEvents(reportData.events);
        setupModal();
    } else {
        console.error('Data not found. Make sure data.js is loaded.');
    }
});

function formatNumber(num) {
    return new Intl.NumberFormat('es-CO').format(num);
}

function renderOverview(totals) {
    const overviewContainer = document.getElementById('overview');
    
    const metrics = [
        { label: 'Visualizaciones', value: totals.views },
        { label: 'Cuentas Alcanzadas', value: totals.reach },
        { label: 'Interacciones Totales', value: totals.interactions },
        { label: 'Publicaciones', value: totals.posts }
    ];

    let html = '';
    metrics.forEach(m => {
        html += `
            <div class="metric-card">
                <div class="metric-title">${m.label}</div>
                <div class="metric-value">${formatNumber(m.value)}</div>
            </div>
        `;
    });
    
    overviewContainer.innerHTML = html;
}

function renderEvents(events) {
    const eventsContainer = document.getElementById('events-container');
    let html = '';

    events.forEach(ev => {
        if (!ev.posts || ev.posts.length === 0) return;

        html += `
            <div class="event-block">
                <div class="event-header">
                    <h2 class="event-title">${ev.name}</h2>
                    <span class="event-date">${ev.day}</span>
                </div>
                <div class="posts-grid">
                    ${ev.posts.map(post => renderPost(post)).join('')}
                </div>
            </div>
        `;
    });

    eventsContainer.innerHTML = html;
}

function renderPost(post) {
    let imagesHtml = '';
    if (post.images && post.images.length > 0) {
        imagesHtml = `
            <div class="post-gallery">
                ${post.images.map(img => `<img src="${img}" class="gallery-img" alt="Screenshot ${post.medium}">`).join('')}
            </div>
        `;
    }

    return `
        <div class="post-card">
            <div class="post-header">
                <h3 class="post-medium">${post.medium}</h3>
                <div class="post-action">${post.action}</div>
                ${post.link && post.link !== 'nan' ? `<a href="${post.link}" class="post-link" target="_blank" rel="noopener noreferrer">Ver Publicación &rarr;</a>` : ''}
            </div>
            <div class="post-body">
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Visualizaciones</span>
                        <span class="stat-value">${formatNumber(post.views)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Alcance</span>
                        <span class="stat-value">${formatNumber(post.reach)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Likes</span>
                        <span class="stat-value">${formatNumber(post.likes)}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Comentarios</span>
                        <span class="stat-value">${formatNumber(post.comments)}</span>
                    </div>
                </div>
                ${imagesHtml}
            </div>
        </div>
    `;
}

function setupModal() {
    const modal = document.getElementById('image-modal');
    const modalImg = document.getElementById('modal-img');
    const closeBtn = document.querySelector('.close-modal');

    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('gallery-img')) {
            modal.style.display = 'block';
            modalImg.src = e.target.src;
        }
    });

    closeBtn.addEventListener('click', () => {
        modal.style.display = 'none';
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });
}

    </script>
