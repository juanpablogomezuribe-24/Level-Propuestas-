<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Suárez - Cámara por Bogotá</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for Browser Rendering -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes slide-down {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down { animation: slide-down 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        body { background-color: #f1f5f9; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mocking Lucide icons for browser usage
        const Icon = ({ name, color = "currentColor", size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size, color: color }} className={className}></i>;
        };

        const App = () => {
            const [activeProposal, setActiveProposal] = useState(null);
            const [showExperience, setShowExperience] = useState(false);
            const [showVotingSteps, setShowVotingSteps] = useState(false);
            const [showProposalsBlock, setShowProposalsBlock] = useState(false);

            const proposals = [
                { id: 1, title: "Clase de educación financiera", desc: "Finanzas personales obligatorias en colegios y universidades para formar criterio económico.", icon: "book-open" },
                { id: 2, title: "Emprendimiento", desc: "Fondos financieros para emprendedores con acompañamiento real y técnico.", icon: "rocket" },
                { id: 3, title: "Mujeres", desc: "Proyectos de autonomía y equidad con gestión robusta para el liderazgo femenino.", icon: "user-circle" },
                { id: 4, title: "Impuestos Competitivos", desc: "Responsabilidad tributaria para mejorar condiciones de ciudadanos y empresas.", icon: "trending-down" },
                { id: 5, title: "Destrabar Bogotá", desc: "Ley de reducción de trámites y ley de consultas previas para acelerar obras.", icon: "zap" },
                { id: 6, title: "Economía Digital", desc: "Reglamentaciones competitivas para transporte, Cripto y Fintech.", icon: "globe" },
                { id: 7, title: "Libertad de Prensa", desc: "Fondo para financiar medios de comunicación y proteger la democracia.", icon: "mic-2" },
                { id: 8, title: "Acceso al Crédito", desc: "Impulsar reglas claras para que MiPymes accedan a financiamiento real.", icon: "credit-card" },
                { id: 9, title: "Inversión en Energía", desc: "Reglas claras y ejecución responsable para proyectos de energía.", icon: "lightbulb" },
                { id: 10, title: "Defensa del Ahorro", desc: "Defensa absoluta de los ahorros y las pensiones de los colombianos.", icon: "shield-check" },
            ];

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 max-w-md mx-auto shadow-2xl overflow-hidden pb-10">
                    
                    <div className="bg-slate-800 text-white py-3 text-center border-b-4 border-pink-500">
                        <p className="text-xs font-black uppercase tracking-[0.3em] text-yellow-400">Cámara de Representantes</p>
                    </div>

                    <section className="relative overflow-hidden bg-white pt-4">
                        <div className="flex h-2 w-full mb-6">
                            <div className="bg-yellow-400 flex-1"></div>
                            <div className="bg-blue-600 flex-1"></div>
                            <div className="bg-red-600 flex-1"></div>
                        </div>
                        <div className="px-8 flex flex-col items-center">
                            <div className="relative mb-6">
                                <div className="w-44 h-44 rounded-full border-4 border-pink-500 bg-slate-100 overflow-hidden shadow-2xl relative z-10">
                                    <img src="https://i.postimg.cc/QNTfcbG0/SOL-(5).png" alt="Sol Suárez" className="w-full h-full object-cover" />
                                </div>
                                <div className="absolute -top-2 -right-2 w-20 h-20 bg-pink-100 rounded-full blur-2xl opacity-60"></div>
                                <div className="absolute -bottom-2 -left-2 w-20 h-20 bg-blue-100 rounded-full blur-2xl opacity-60"></div>
                            </div>
                            <div className="text-center mb-6">
                                <h1 className="text-4xl font-black tracking-tighter text-blue-700 leading-tight uppercase">SOL SUÁREZ</h1>
                                <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mt-1">SOL POR BOGOTÁ</p>
                                <div className="mt-4 flex flex-col items-center">
                                    <div className="h-0.5 w-16 bg-pink-500 mb-3"></div>
                                    <p className="text-slate-400 font-bold px-4 text-[10px] uppercase tracking-widest leading-tight">Economía clara • Decisiones responsables • Resultados reales</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section className="px-6 mb-8">
                        <button onClick={() => setShowVotingSteps(!showVotingSteps)} className="w-full bg-yellow-400 text-slate-800 font-black py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 transform transition-all active:scale-95 hover:bg-yellow-300 italic uppercase border-b-4 border-yellow-600">
                            <Icon name="vote" className="text-blue-700" size={24} /> ¿CÓMO VOTAR POR SOL?
                        </button>
                        {showVotingSteps && (
                            <div className="mt-4 bg-white rounded-3xl p-6 border-2 border-pink-500 animate-slide-down shadow-xl">
                                <img src="https://i.postimg.cc/rsBGY7Bz/SOL-ENE28-1.png" alt="Tarjetón" className="w-full h-auto rounded-xl shadow-md mb-6" />
                                <div className="space-y-4 text-left">
                                    <div className="flex items-center gap-4">
                                        <div className="w-8 h-8 bg-blue-700 text-white rounded-full flex items-center justify-center font-black shrink-0 text-xs">1</div>
                                        <p className="text-xs font-bold uppercase text-slate-600">Pide el tarjetón de la <span className="text-pink-600 font-black text-sm">Cámara</span></p>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="w-8 h-8 bg-blue-700 text-white rounded-full flex items-center justify-center font-black shrink-0 text-xs">2</div>
                                        <p className="text-xs font-bold uppercase text-slate-600">Busca el logo <span className="text-blue-700 font-black">CIUDADANOS RENOVEMOS</span></p>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <div className="w-8 h-8 bg-pink-500 text-white rounded-full flex items-center justify-center font-black shrink-0 text-xs animate-bounce">3</div>
                                        <p className="text-xs font-bold uppercase text-slate-700">Marca el número <span className="text-xl font-black text-pink-600">108</span></p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </section>

                    <section className="px-8 mb-10 text-center">
                        <div className="w-full h-auto rounded-2xl overflow-hidden shadow-lg mb-8 border border-slate-200">
                            <img src="https://i.postimg.cc/gjCyB1CB/SOL-POR-BOGOTA-1.jpg" alt="Sol por Bogotá" className="w-full h-auto" />
                        </div>
                        <h2 className="text-2xl font-black mb-6 text-pink-600 leading-tight uppercase italic px-2 text-center">Apostar por Sol es invertir en una Colombia que avanza</h2>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <p className="text-slate-600 leading-relaxed text-sm text-left">Sol entiende <strong>el problema, la solución y, sobre todo, cómo financiarla.</strong> Su trayectoria respalda una visión basada en el rigor técnico y la pedagogía económica.</p>
                        </div>
                    </section>

                    <section className="px-6 space-y-4">
                        <div>
                            <button onClick={() => setShowExperience(!showExperience)} className="flex items-center justify-between w-full bg-blue-700 text-white px-6 py-4 rounded-2xl font-black shadow-md hover:bg-blue-800 transition-all italic uppercase tracking-tighter">
                                <div className="flex items-center gap-3"><Icon name="briefcase" color="#facc15" /> Mi Experiencia</div>
                                <Icon name="chevron-down" className={`transition-transform ${showExperience ? 'rotate-180' : ''}`} />
                            </button>
                            {showExperience && (
                                <div className="mt-2 bg-white p-4 rounded-2xl border border-blue-100 shadow-inner animate-slide-down space-y-6 text-left text-xs">
                                    <div className="grid grid-cols-1 gap-3">
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                                            <span className="block text-2xl font-black text-pink-600 mb-1">+10 años</span>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase">Explicando economía y finanzas en medios colombianos</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center">
                                            <span className="block text-2xl font-black text-pink-600 mb-1">+1.000 análisis</span>
                                            <p className="text-[10px] text-slate-500 font-bold uppercase">Sobre reformas, impuestos e inflación del Estado</p>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="border-l-4 border-pink-500 pl-3">
                                            <h4 className="font-black text-slate-800 uppercase italic leading-tight">W Radio Colombia</h4>
                                            <p className="text-slate-600 font-medium italic mt-1">Análisis político y económico con Julio Sánchez Cristo.</p>
                                        </div>
                                        <div className="border-l-4 border-blue-600 pl-3">
                                            <h4 className="font-black text-slate-800 uppercase italic leading-tight">Noticias Caracol</h4>
                                            <p className="text-slate-500 font-bold uppercase mt-1 text-[10px]">Editora de Macroeconomía</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div>
                            <button onClick={() => setShowProposalsBlock(!showProposalsBlock)} className="flex items-center justify-between w-full bg-pink-500 text-white px-6 py-4 rounded-2xl font-black shadow-md hover:bg-pink-600 transition-all italic uppercase tracking-tighter">
                                <div className="flex items-center gap-3"><Icon name="list-checks" color="#facc15" /> Mis Compromisos</div>
                                <Icon name="chevron-down" className={`transition-transform ${showProposalsBlock ? 'rotate-180' : ''}`} />
                            </button>
                            {showProposalsBlock && (
                                <div className="mt-3 space-y-3 animate-slide-down">
                                    {proposals.map((prop) => (
                                        <div key={prop.id} onClick={() => setActiveProposal(activeProposal === prop.id ? null : prop.id)} className={`p-4 rounded-xl transition-all duration-300 border shadow-sm cursor-pointer bg-white ${activeProposal === prop.id ? 'border-pink-500 bg-pink-50/20' : 'border-slate-100'}`}>
                                            <div className="flex items-center gap-3">
                                                <Icon name={prop.icon} className={activeProposal === prop.id ? 'text-pink-600' : 'text-blue-500'} size={18} />
                                                <h3 className="font-bold text-[11px] uppercase tracking-tight flex-1">{prop.title}</h3>
                                                <Icon name="chevron-down" size={14} className={`transition-transform ${activeProposal === prop.id ? 'rotate-180' : ''}`} />
                                            </div>
                                            {activeProposal === prop.id && (
                                                <p className="mt-3 text-slate-600 text-xs leading-relaxed animate-fade-in pl-8 border-t border-slate-100 pt-2">{prop.desc}</p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </section>

                    <section className="mt-12 px-8 text-center">
                        <div className="bg-slate-800 p-8 rounded-[40px] shadow-2xl transform rotate-1 border-b-8 border-pink-500 text-white italic uppercase font-black">
                            <h3 className="text-xl leading-tight">VAMOS A SUBIRLE EL NIVEL DE DEBATE AL CONGRESO</h3>
                            <p className="mt-4 text-yellow-400 text-sm tracking-tighter">Porque si conoces tu economía tienes el poder</p>
                        </div>
                    </section>

                    <section className="mt-10 px-4 space-y-4">
                        <div className="rounded-3xl overflow-hidden shadow-xl border-2 border-slate-200"><img src="https://i.postimg.cc/wTNnTzTW/SOL-ENE22-03.jpg" className="w-full h-auto" /></div>
                        <div className="rounded-3xl overflow-hidden shadow-xl border-4 border-blue-600"><img src="https://i.postimg.cc/5y2vKbKL/Whats-App-Image-2026-02-23-at-4-36-18-PM.jpg" className="w-full h-auto" /></div>
                    </section>

                    <section className="bg-white p-10 text-center mt-10 mx-4 rounded-3xl shadow-lg border-2 border-slate-100">
                        <div className="mb-10">
                            <p className="text-sm font-black text-slate-800 uppercase italic leading-tight">¿Te gusta mi propuesta?</p>
                            <p className="text-xs text-slate-500 mt-2 font-medium">Por favor, comparte esta tarjeta con tus contactos y ayúdame a multiplicar este mensaje.</p>
                        </div>
                        <div className="flex flex-col items-center gap-4">
                            <p className="text-[10px] font-black uppercase tracking-widest text-pink-500">Sígueme en redes</p>
                            <a href="https://www.instagram.com/solsuarezj?igsh=MTJzaHYxcWlkcDBqaQ==" target="_blank" className="flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-yellow-400 via-pink-500 to-blue-600 rounded-full shadow-lg transform transition-transform hover:scale-110 active:scale-90">
                                <Icon name="instagram" color="white" size={32} />
                            </a>
                            <p className="text-[11px] font-bold text-slate-400 mt-1 italic">@solsuarezj</p>
                        </div>
                        <div className="h-px w-full bg-slate-100 my-8"></div>
                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em] leading-tight">Publicidad Política Pagada<br/><span className="text-pink-500">Ciudadanos Renovemos</span> | Cámara por Bogotá</p>
                    </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
