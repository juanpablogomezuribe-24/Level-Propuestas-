        // This solves the 'forwardRef' error by manually creating React components from the vanilla Lucide library
        // instead of relying on the potentially broken UMD build of lucide-react.
        
        const createIconComponent = (iconName) => {
            // 1. Safety check: Ensure lucide exists
            if (!window.lucide || !window.lucide.icons) {
                return () => null; // Graceful fallback
            }

            // 2. Get definition
            const iconDef = window.lucide.icons[iconName];
            
            // 3. If definition missing, return null component
            if (!iconDef) {
                return () => null;
            }

            // 4. Return React Component
            return React.forwardRef(({ color = "currentColor", size = 24, strokeWidth = 2, className = "", ...props }, ref) => {
                // 5. Runtime check: Ensure iconDef is an array [tag, attrs, children]
                if (!Array.isArray(iconDef)) return null;

                const [tag, attrs, children] = iconDef;
                
                return React.createElement(
                    tag,
                    {
                        ref,
                        ...attrs,
                        width: size,
                        height: size,
                        stroke: color,
                        strokeWidth: strokeWidth,
                        className: `lucide lucide-${iconName.toLowerCase()} ${className}`,
                        ...props
                    },
                    // 6. Safe mapping of children
                    Array.isArray(children) 
                        ? children.map(([childTag, childAttrs], index) => 
                            React.createElement(childTag, { ...childAttrs, key: index })
                          )
                        : null
                );
            });
        };

                                    <p className="text-xs text-slate-500 mt-1">Reportó 10 agotados críticos</p>
                                </div>
                                <div className="p-4 bg-purple-50 rounded-xl border border-purple-100 flex flex-col items-center text-center">
                                    <div className="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center text-purple-600 mb-2">
                                        {CheckCircle && <CheckCircle size={24} />}
                                    </div>
                                    <p className="font-bold text-slate-800 text-sm">7 Días Racha</p>
                                    <p className="text-xs text-slate-500 mt-1">Asistencia perfecta semanal</p>
                                </div>
                                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex flex-col items-center text-center opacity-50">
                                    <div className="w-12 h-12 bg-slate-200 rounded-full flex items-center justify-center text-slate-400 mb-2">
                                        {Award && <Award size={24} />}
                                    </div>
                                    <p className="font-bold text-slate-800 text-sm">Super Vendedor</p>
                                    <p className="text-xs text-slate-500 mt-1">Bloqueado</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900 flex flex-col md:flex-row">
                    {/* Sidebar (Admin) */}
                    <aside className="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col z-30">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-2">
                            <div className="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">B</div>
                            <span className="text-xl font-bold tracking-tight">Bloopit</span>
                        </div>
                        <nav className="flex-1 p-4 space-y-1">
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                            >
                                {LayoutDashboard && <LayoutDashboard size={18} />} Dashboard
                            </button>
                            <button 
                                onClick={() => setActiveTab('catalogs')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'catalogs' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                            >
                                {Package && <Package size={18} />} Catálogos & Stock
                            </button>
                            <button 
                                onClick={() => setActiveTab('routes')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'routes' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                            >
                                {MapIcon && <MapIcon size={18} />} Rutas & Geo
                            </button>
                            <button 
                                onClick={() => setActiveTab('gamification')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all ${activeTab === 'gamification' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                            >
                                {Award && <Award size={18} />} Gamificación
                            </button>
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs">AU</div>
                                <div>
                                    <p className="text-sm font-medium">Admin User</p>
                                    <p className="text-xs text-slate-500">Gerente Trade</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden">
                        {/* Header */}
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm">
                            <h1 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                                {activeTab === 'dashboard' && <>{LayoutDashboard && <LayoutDashboard size={20} className="text-slate-400"/>} Control de Operaciones</>}
                                {activeTab === 'catalogs' && <>{Package && <Package size={20} className="text-slate-400"/>} Smart Catalog & Stock</>}
                                {activeTab === 'routes' && <>{MapIcon && <MapIcon size={20} className="text-slate-400"/>} Rutas y Geolocalización</>}
                                {activeTab === 'gamification' && <>{Award && <Award size={20} className="text-slate-400"/>} Gamificación de Equipo</>}
                            </h1>
                            <div className="flex items-center gap-4">
                                <div className="hidden md:flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full text-sm text-slate-600 transition-all focus-within:ring-2 focus-within:ring-indigo-500 focus-within:bg-white">
                                    {Search && <Search size={14} />}
                                    <input type="text" placeholder="Buscar..." className="bg-transparent border-none focus:outline-none text-sm placeholder:text-slate-400 w-32"/>
                                </div>
                                <button className="p-2 text-slate-400 hover:text-indigo-600 transition-colors relative">
                                    {AlertCircle && <AlertCircle size={20} />}
                                    <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                                </button>
                            </div>
                        </header>

                        {/* Content & WhatsApp Wrapper */}
                        <div className="flex-1 overflow-hidden relative flex">
                            
                            {/* Dynamic Content Canvas */}
                            <div className="flex-1 overflow-y-auto p-6 pb-24 bg-slate-50/50">
                                {activeTab === 'dashboard' && <DashboardView />}
                                {activeTab === 'catalogs' && <CatalogView />}
                                {activeTab === 'routes' && <RoutesView />}
                                {activeTab === 'gamification' && <GamificationView />}
                            </div>

                            {/* WhatsApp Simulator (Sticky Right) */}
                            <div className="w-full md:w-[380px] bg-slate-100 border-l border-slate-200 flex flex-col shadow-2xl absolute md:relative z-40 h-full right-0 top-0">
                                
                                {/* Phone Header */}
                                <div className="bg-emerald-600 p-4 text-white flex items-center gap-3 shadow-md shrink-0">
                                    <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center overflow-hidden border-2 border-emerald-700">
                                        <div className="text-emerald-600 font-bold text-lg">B</div>
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="font-bold">Bloopit Bot 🤖</h3>
                                        <p className="text-xs opacity-90 text-emerald-100 flex items-center gap-1">
                                            <span className="w-1.5 h-1.5 bg-green-300 rounded-full animate-pulse"></span> En línea
                                        </p>
                                    </div>
                                    <div className="bg-emerald-700/50 px-3 py-1 rounded-full text-[10px] font-mono border border-emerald-500 shadow-sm backdrop-blur-sm">
                                        {gamificationPoints} PTS
                                    </div>
                                </div>

                                {/* Chat Area */}
                                <div className="flex-1 overflow-y-auto p-4 bg-[#e5ddd5] space-y-3 scroll-smooth scrollbar-hide" ref={scrollRef} style={{ backgroundImage: 'url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png")', backgroundBlendMode: 'soft-light' }}>
                                    <div className="text-center text-xs text-slate-500 my-4 bg-white/80 py-1 rounded-full mx-auto w-fit px-4 shadow-sm backdrop-blur-sm">
                                        Hoy
                                    </div>
                                    
                                    {messages.map(msg => (
                                        <div key={msg.id} className={`flex ${msg.type === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2`}>
                                            <div className={`max-w-[85%] rounded-lg shadow-sm relative overflow-hidden ${
                                                msg.type === 'user' 
                                                ? 'bg-[#dcf8c6] text-slate-800 rounded-tr-none' 
                                                : 'bg-white text-slate-800 rounded-tl-none'
                                            }`}>
                                                {/* Image Support */}
                                                {msg.image && (
                                                    <div className="w-full">
                                                        <img src={msg.image} alt="Message attachment" className="w-full h-auto block" />
                                                    </div>
                                                )}
                                                
                                                <div className="p-2 px-3">
                                                    {msg.caption && <div className="font-bold text-sm mb-1 whitespace-pre-wrap">{msg.caption}</div>}
                                                    {msg.text && <div className="whitespace-pre-wrap text-sm">{msg.text}</div>}
                                                    <div className="text-[10px] text-slate-400 text-right mt-1 flex justify-end gap-1">
                                                        10:42 AM {msg.type === 'user' && <span className="text-blue-400">✓✓</span>}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                    
                                    {/* Contextual Quick Actions */}
                                    {messages.length > 0 && messages[messages.length - 1].type === 'bot' && (
                                        <div className="flex flex-wrap gap-2 justify-center mt-2 animate-in fade-in zoom-in duration-300">
                                            {selectedStore ? (
                                                products.map(p => (
                                                    <button 
                                                        key={p.id}
                                                        onClick={() => handleReportStock(p.id, Math.floor(Math.random() * 20))}
                                                        className="bg-white border border-slate-200 text-slate-700 text-xs px-3 py-2 rounded-full shadow-sm hover:bg-emerald-50 hover:text-emerald-700 active:scale-95 transition-all flex items-center gap-1"
                                                    >
                                                        {AlertCircle && <AlertCircle size={10} className={p.isMustHave ? "text-amber-500" : "text-slate-300"} />}
                                                        Reportar {p.name.split(' ').slice(0, 2).join(' ')}
                                                    </button>
                                                ))
                                            ) : (
                                                <div className="text-xs text-slate-500 bg-white/90 p-3 rounded-lg text-center w-full shadow-sm border border-slate-100">
                                                    <p>💬 Escribe el nombre de la tienda para que la IA la busque.</p>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* Input Area */}
                                <div className="p-3 bg-white border-t border-slate-200 shrink-0">
                                    <form onSubmit={handleManualMessage} className="flex gap-2">
                                        <input 
                                            type="text" 
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            placeholder="Escribir mensaje..."
                                            className="flex-1 bg-slate-100 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-colors"
                                        />
                                        <button type="submit" className="bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-emerald-700 hover:scale-105 transition-all shadow-md">
                                            {Send && <Send size={18} />}
                                        </button>
                                    </form>
                                </div>
                            </div>

                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BloopitApp />);
    </script>
</body>
</html>
