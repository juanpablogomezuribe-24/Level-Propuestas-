        const createIconComponent = (iconName) => {
            if (!window.lucide || !window.lucide.icons) return () => null;
            const iconDef = window.lucide.icons[iconName];
            if (!iconDef) return () => null;
            return React.forwardRef(({ color = "currentColor", size = 24, strokeWidth = 2, className = "", ...props }, ref) => {
                if (!Array.isArray(iconDef)) return null;
                const [tag, attrs, children] = iconDef;
                return React.createElement(tag, {
                    ref, ...attrs, width: size, height: size, stroke: color, strokeWidth: strokeWidth,
                    className: `lucide lucide-${iconName.toLowerCase()} ${className}`, ...props
                }, Array.isArray(children) ? children.map(([childTag, childAttrs], index) => React.createElement(childTag, { ...childAttrs, key: index })) : null);

                    // Default to first category available

                        </section>
                        
                         <hr className="border-slate-100"/>

                        {/* 4. Alcance */}
                        <section>
                             <h2 className="text-2xl font-bold text-slate-800 mb-4">4. ALCANCE DEL PROYECTO</h2>
                             <div className="bg-slate-50 rounded-xl p-6 border border-slate-200">
                                <h3 className="text-sm font-bold text-slate-800 mb-4 uppercase">Fase 1: Desarrollo del MVP</h3>
                                <ul className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 text-sm text-slate-600">
                                    <li>• Integración WhatsApp Business API (Meta).</li>
                                    <li>• Registro manual de tiendas como fallback.</li>
                                    <li>• Panel administrativo web responsive.</li>
                                    <li>• Módulos CRUD completos.</li>
                                    <li>• Gestión de Material de Referencia (Carga/Org).</li>
                                    <li>• Visualización de planogramas en móvil.</li>
                                    <li>• Dashboard con métricas y mapa.</li>
                                </ul>
                            </div>
                             <div className="mt-4 bg-slate-50 rounded-xl p-6 border border-slate-200 opacity-75">
                                <h3 className="text-sm font-bold text-slate-800 mb-4 uppercase">Fase 2: Funcionalidades Avanzadas (Opcional)</h3>
                                <ul className="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 text-sm text-slate-600">
                                    <li>• Score de cumplimiento automático.</li>
                                    <li>• Reportes avanzados y predictivos.</li>
                                </ul>
                            </div>
                        </section>

                        <hr className="border-slate-100"/>

                        {/* 5. Infraestructura y Costos */}
                        <section>
                            <h2 className="text-2xl font-bold text-slate-800 mb-6">5. INFRAESTRUCTURA Y COSTOS VARIABLES</h2>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                                    <h3 className="font-bold text-slate-800 mb-3">Infraestructura Incluida (Cluster)</h3>
                                    <ul className="text-sm text-slate-600 space-y-1">
                                        <li>• Hasta 10.000 mercaderistas concurrentes.</li>
                                        <li>• Almacenamiento de 2 Tb.</li>
                                        <li>• Monitoreo 24/7 y Backups diarios.</li>
                                        <li>• Certificados SSL/TLS y Firewall.</li>
                                    </ul>
                                </div>
                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                                    <h3 className="font-bold text-slate-800 mb-3">Costos Variables (OpEx)</h3>
                                    <div className="space-y-3">
                                        <div className="flex justify-between text-sm border-b border-slate-200 pb-2">
                                            <span>Mensajería Marketing (WhatsApp)</span>
                                            <span className="font-bold text-emerald-600">$0.022 USD / mensaje</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                    </div>
                </div>
            );

            // --- MAIN RENDER ---
            return (
                <div className="flex h-screen overflow-hidden font-sans text-slate-900">
                    
                    {/* LEFT: ADMIN INTERFACE */}
                    <div className="flex-1 flex flex-col md:flex-row bg-slate-100 overflow-hidden relative">
                        {/* Sidebar */}
                        <aside className="w-64 bg-slate-900 text-white flex flex-col shrink-0 z-20">
                            <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">B</div>
                                <div>
                                    <h1 className="font-bold leading-none">BDF Retail</h1>
                                    <span className="text-[10px] text-slate-400">Admin Console</span>
                                </div>
                            </div>
                            <div className="p-4 border-b border-slate-800">
                                <label className="text-[10px] text-slate-400 uppercase font-bold block mb-2">Rol Actual</label>
                                <div className="flex bg-slate-800 rounded-lg p-1">
                                    <button onClick={() => setRole('superadmin')} className={`flex-1 text-xs py-1 rounded ${role === 'superadmin' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}>SuperAdmin</button>
                                    <button onClick={() => setRole('admin')} className={`flex-1 text-xs py-1 rounded ${role === 'admin' ? 'bg-purple-600 text-white' : 'text-slate-400 hover:text-white'}`}>Analista</button>
                                </div>
                            </div>
                            <nav className="flex-1 p-4 space-y-2">
                                <button onClick={() => setView('dashboard')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {LayoutDashboard && <LayoutDashboard size={18}/>} Dashboard
                                </button>
                                <button 
                                    onClick={() => role === 'superadmin' && setView('whatsapp_center')} 
                                    className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'whatsapp_center' ? 'bg-green-600 text-white' : role === 'superadmin' ? 'text-green-400 hover:bg-slate-800 hover:text-white' : 'text-slate-600 cursor-not-allowed opacity-50'}`}
                                    disabled={role !== 'superadmin'}
                                >
                                    {MessageSquare && <MessageSquare size={18}/>} WhatsApp Center
                                    {role !== 'superadmin' && <Lock size={12} className="ml-auto"/>}
                                </button>
                                <button onClick={() => setView('content')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'content' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {FileText && <FileText size={18}/>} Folletos Digitales
                                </button>
                                <button onClick={() => setView('routes')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'routes' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {MapIcon && <MapIcon size={18}/>} Rutas & Geo
                                </button>
                                <div className="mt-auto pt-4 border-t border-slate-800">
                                    <button onClick={() => setView('proposal')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold w-full transition-colors border border-slate-600 ${view === 'proposal' ? 'bg-slate-700 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
                                        {BookOpen && <BookOpen size={18}/>} Propuesta Comercial
                                    </button>
                                </div>
                            </nav>
                        </aside>

                        {/* Content Area */}
                        <div className="flex-1 flex flex-col h-full overflow-hidden">
                            <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0">
                                <h2 className="font-bold text-slate-800 text-lg">
                                    {view === 'whatsapp_center' ? 'WhatsApp CRM Center' : 
                                     view === 'proposal' ? 'Propuesta Comercial' : 'Panel de Control'}
                                </h2>
                            </header>
                            <div className="flex-1 overflow-y-auto p-6 relative">
                                {view === 'dashboard' && renderDashboard()}
                                {view === 'whatsapp_center' && renderWhatsappCenter()}
                                {view === 'proposal' && renderProposal()}
                                {view === 'content' && renderContentManager()}
                                {view === 'routes' && renderRoutes()}
                            </div>
                        </div>
                    </div>

                    {/* RIGHT: SIMULATOR */}
                    <div className="w-[400px] bg-slate-200 flex flex-col shadow-2xl border-l border-slate-300 relative z-30">
                        <div className="bg-[#005e54] p-3 text-white flex items-center gap-3 shadow-md shrink-0">
                            <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center font-bold text-[#005e54] text-lg">B</div>
                            <div className="flex-1">
                                <h3 className="font-bold text-sm">BDF Asistente 🤖</h3>
                                <p className="text-xs opacity-80">En línea</p>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 chat-bg scrollbar-hide">
                            {messages.map((msg) => (
                                <div key={msg.id} className={`flex ${msg.from === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] rounded-lg shadow-sm p-2 text-sm relative ${msg.from === 'user' ? 'bg-[#dcf8c6]' : 'bg-white'}`}>
                                        {msg.type === 'text' ? <p className="whitespace-pre-wrap">{msg.content}</p> : 
                                         <img src={msg.content} className="rounded-lg mb-1 w-full"/>}
                                        <div className="text-[9px] text-slate-400 text-right mt-1">10:42 AM</div>
                                    </div>
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                            {chatStep === 5 && (
                                <div className="flex justify-center mt-2">
                                    <button onClick={simulatePhotoUpload} className="bg-white text-slate-700 text-xs font-bold px-4 py-2 rounded-full shadow-md flex items-center gap-2 hover:bg-slate-50 transition-transform active:scale-95">
                                        {Camera && <Camera size={14}/>} Enviar Foto
                                    </button>
                                </div>
                            )}
                        </div>
                        <div className="p-2 bg-[#f0f0f0] shrink-0 flex items-center gap-2">
                            <input value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSend(e)} type="text" placeholder="Escribe un mensaje..." className="flex-1 rounded-full px-4 py-2 text-sm border-none focus:ring-0 focus:outline-none"/>
                            <button onClick={handleSend} className="bg-[#005e54] text-white p-2 rounded-full shadow-sm hover:opacity-90">{Send && <Send size={18}/>}</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BDFApp />);
    </script>
</body>
</html>
