    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Usamos la versión vanilla para el adaptador seguro -->

            background-image: radial-gradient(#9ca3af 1px, transparent 1px);

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICON ADAPTER SYSTEM (Robust) ---
        const createIconComponent = (iconName) => {
            if (!window.lucide || !window.lucide.icons) return () => null;
            const iconDef = window.lucide.icons[iconName];
            if (!iconDef) return () => null;
            return React.forwardRef(({ color = "currentColor", size = 24, strokeWidth = 2, className = "", ...props }, ref) => {
                if (!Array.isArray(iconDef)) return null;
                const [tag, attrs, children] = iconDef;
                return React.createElement(tag, {
                    ref, ...attrs, width: size, height: size, stroke: color, strokeWidth: strokeWidth,
                    className: `lucide lucide-${iconName.toLowerCase()} ${className}`, ...props
                }, Array.isArray(children) ? children.map(([childTag, childAttrs], index) => React.createElement(childTag, { ...childAttrs, key: index })) : null);
            });
        };

        const Icons = {
            LayoutDashboard: createIconComponent('LayoutDashboard'),
            Users: createIconComponent('Users'),
            MapPin: createIconComponent('MapPin'),
            Trophy: createIconComponent('Trophy'),
            Image: createIconComponent('Image'),
            MessageSquare: createIconComponent('MessageSquare'),
            Settings: createIconComponent('Settings'),
            Search: createIconComponent('Search'),
            Send: createIconComponent('Send'),
            Camera: createIconComponent('Camera'),
            CheckCircle: createIconComponent('CheckCircle'),
            AlertCircle: createIconComponent('AlertCircle'),
            BarChart: createIconComponent('BarChart'),
            Upload: createIconComponent('Upload'),
            FileText: createIconComponent('FileText'),
            MoreVertical: createIconComponent('MoreVertical'),
            Map: createIconComponent('Map'),
            Flame: createIconComponent('Flame'),
            Target: createIconComponent('Target'),
            Phone: createIconComponent('Phone'),
            Mail: createIconComponent('Mail'),
            Calendar: createIconComponent('Calendar'),
            TrendingUp: createIconComponent('TrendingUp'),
            UserPlus: createIconComponent('UserPlus'),
            Filter: createIconComponent('Filter'),
            Plus: createIconComponent('Plus'),
            Package: createIconComponent('Package'),
            Store: createIconComponent('Store'),
            Award: createIconComponent('Award'),
            BookOpen: createIconComponent('BookOpen'),
            DollarSign: createIconComponent('DollarSign'),
            Smartphone: createIconComponent('Smartphone'),
            Server: createIconComponent('Server'),
            Zap: createIconComponent('Zap'),
            ShieldCheck: createIconComponent('ShieldCheck'),
            Eye: createIconComponent('Eye'),
            ArrowDownToLine: createIconComponent('ArrowDownToLine'),
            ArrowUpToLine: createIconComponent('ArrowUpToLine')
        };

        const { 
            LayoutDashboard, Users, MapPin, Trophy, Image: ImageIcon, MessageSquare, 
            Settings, Search, Send, Camera, CheckCircle, AlertCircle, BarChart, 
            Upload, FileText, MoreVertical, Map: MapIcon, Flame, Target, Phone, 
            Mail, Calendar, TrendingUp, UserPlus, Filter, Plus, Package, Store, Award,
            BookOpen, DollarSign, Smartphone, Server, Zap, ShieldCheck, Eye, ArrowDownToLine, ArrowUpToLine
        } = Icons;

        // --- MOCK DATA ---
        const RETAILERS = [
            { id: 1, name: 'Farmatodo - 93', type: 'Droguería', city: 'Bogotá', status: 'Activo', visits: 145, lat: 20, lng: 30, heat: 'high' },
            { id: 2, name: 'Cruz Verde - Pepe', type: 'Droguería', city: 'Bogotá', status: 'Activo', visits: 98, lat: 50, lng: 60, heat: 'medium' },
            { id: 3, name: 'Éxito - Wow', type: 'Retail', city: 'Bogotá', status: 'Activo', visits: 210, lat: 70, lng: 20, heat: 'high' },
            { id: 4, name: 'Oxxo - Chicó', type: 'Conveniencia', city: 'Bogotá', status: 'Activo', visits: 340, lat: 35, lng: 75, heat: 'high' },
            { id: 5, name: 'Jumbo - Calle 80', type: 'Retail', city: 'Bogotá', status: 'Inactivo', visits: 12, lat: 80, lng: 80, heat: 'low' },
        ];

        const INFALTABLES_ASSETS = {
            'Farmatodo': { flyer: 'https://i.postimg.cc/FFLr3BXZ/infaltables-1.png', plano: 'https://i.postimg.cc/wjKsDmrQ/planograma-nivea.png' },
            'Cruz Verde': { flyer: 'https://i.postimg.cc/FFLr3BXZ/infaltables-1.png', plano: 'https://i.postimg.cc/wjKsDmrQ/planograma-nivea.png' },
            'Éxito': { flyer: 'https://i.postimg.cc/FFLr3BXZ/infaltables-1.png', plano: 'https://i.postimg.cc/wjKsDmrQ/planograma-nivea.png' },
            'Oxxo': { flyer: 'https://i.postimg.cc/FFLr3BXZ/infaltables-1.png', plano: 'https://i.postimg.cc/wjKsDmrQ/planograma-nivea.png' },
        };

        const GALLERY = [
            { id: 1, user: 'Maria G.', store: 'Farmatodo - 93', time: '10:30 AM', img: 'https://placehold.co/150x150/png?text=Gondola+OK', score: 10 },
            { id: 2, user: 'Juan P.', store: 'Oxxo - Chicó', time: '09:15 AM', img: 'https://placehold.co/150x150/png?text=Gondola+OK', score: 10 },
            { id: 3, user: 'Carlos R.', store: 'Cruz Verde - Pepe', time: '08:45 AM', img: 'https://placehold.co/150x150/png?text=Exhibicion', score: 5 },
        ];

        const CONTACTS = [
            { id: 1, name: 'Maria Gonzalez', role: 'Mercaderista Senior', phone: '3001234567', email: 'maria@bdf.com', points: 1250, rank: 1, status: 'En Ruta', zone: 'Norte', streak: 12, totalVisits: 145, tags: ['Experto', 'Zona Norte'] },
            { id: 2, name: 'Juan Perez', role: 'Mercaderista Junior', phone: '3109876543', email: 'juan@bdf.com', points: 980, rank: 2, status: 'En Ruta', zone: 'Sur', streak: 5, totalVisits: 98, tags: ['Nuevo'] },
            { id: 3, name: 'Carlos Ruiz', role: 'Mercaderista', phone: '3205551122', email: 'carlos@bdf.com', points: 450, rank: 15, status: 'Inactivo', zone: 'Occidente', streak: 0, totalVisits: 45, tags: ['Riesgo'] },
            { id: 4, name: 'Ana Lopez', role: 'Mercaderista Senior', phone: '3151112233', email: 'ana@bdf.com', points: 1100, rank: 3, status: 'En Ruta', zone: 'Norte', streak: 8, totalVisits: 130, tags: ['Líder'] },
        ];

        const RETAIL_STATS = [
            { name: 'Oxxo', visits: 450, color: 'bg-red-500' },
            { name: 'Éxito', visits: 320, color: 'bg-yellow-400' },
            { name: 'Farmatodo', visits: 210, color: 'bg-blue-600' },
            { name: 'Cruz Verde', visits: 180, color: 'bg-green-600' },
            { name: 'Jumbo', visits: 120, color: 'bg-green-500' },
        ];

        // --- APP COMPONENT ---
        function BDFApp() {
            const [view, setView] = useState('dashboard');
            
            // --- Chat State ---
            // Initial state is asking for credentials
            const [messages, setMessages] = useState([
                { id: 1, from: 'bot', type: 'text', content: '👋 Bienvenido a la plataforma BDF Retail.\n\nPara iniciar tu turno, por favor ingresa tu **Nombre Completo** y **Cédula**.' }
            ]);
            const [input, setInput] = useState('');
            const [points, setPoints] = useState(150);
            const [chatStep, setChatStep] = useState('LOGIN'); // NEW: Login step
            const [currentStore, setCurrentStore] = useState(null);
            const chatEndRef = useRef(null);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            // --- Chat Logic ---
            const handleSend = (e) => {
                e.preventDefault();
                if(!input.trim()) return;
                
                const userMsg = { id: Date.now(), from: 'user', type: 'text', content: input };
                setMessages(prev => [...prev, userMsg]);
                setInput('');

                setTimeout(() => {
                    processBotResponse(userMsg.content);
                }, 1000);
            };

            const processBotResponse = (text) => {
                const lowerText = text.toLowerCase();

                // STEP: LOGIN (New)
                if (chatStep === 'LOGIN') {
                    setMessages(prev => [
                        ...prev,
                        { id: Date.now(), from: 'bot', type: 'text', content: `✅ Gracias **${text}**. Datos validados correctamente.\n\n📍 ¿Qué punto de venta visitas hoy?` }
                    ]);
                    setChatStep(0); // Move to Store Selection
                    return;
                }
                
                // Paso 0: Identificar Tienda
                if (chatStep === 0) {
                    let store = Object.keys(INFALTABLES_ASSETS).find(k => lowerText.includes(k.toLowerCase()));
                    if (!store) store = 'Farmatodo'; 
                    
                    setCurrentStore(store);
                    setMessages(prev => [
                        ...prev,
                        { id: Date.now(), from: 'bot', type: 'text', content: `✅ Perfecto, vas para **${store}**.\n\nAquí tienes el folleto digital de **INFALTABLES** para hoy:` },
                        { id: Date.now()+1, from: 'bot', type: 'image', content: INFALTABLES_ASSETS[store].flyer, caption: '📄 Folleto Digital BDF' },
                        { id: Date.now()+2, from: 'bot', type: 'text', content: '¿Quieres ver cómo se deben ver en la góndola? (Sí/No)' }
                    ]);
                    setChatStep(1);
                    return;
                }

                if (chatStep === 1) {
                    if (lowerText.includes('si') || lowerText.includes('sí')) {
                        setMessages(prev => [
                            ...prev,
                            { id: Date.now(), from: 'bot', type: 'text', content: 'Aquí tienes la referencia visual:' },
                            { id: Date.now()+1, from: 'bot', type: 'image', content: INFALTABLES_ASSETS[currentStore].plano, caption: '📸 Foto de Éxito' },
                            { id: Date.now()+2, from: 'bot', type: 'text', content: 'Avísame cuando llegues al punto y tengas la exhibición lista escribiendo "Listo".' }
                        ]);
                    } else {
                        setMessages(prev => [
                            ...prev,
                            { id: Date.now(), from: 'bot', type: 'text', content: 'Ok. Avísame cuando llegues al punto y tengas la exhibición lista escribiendo "Listo".' }
                        ]);
                    }
                    setChatStep(4);
                    return;
                }

                if (chatStep === 4) {
                    setMessages(prev => [
                        ...prev,
                        { id: Date.now(), from: 'bot', type: 'text', content: '📍 Geo-localización confirmada en punto de venta.\n\nPor favor envíame una **FOTO** de cómo quedó la góndola para validar tu visita y darte tus puntos. 📸' }
                    ]);
                    setChatStep(5);
                    return;
                }

                if (chatStep === 5) {
                    setMessages(prev => [
                        ...prev,
                        { id: Date.now(), from: 'bot', type: 'text', content: '🌟 **¡Excelente trabajo!**\n\nFoto recibida y validada. La exhibición cumple con los estándares.\n\n🏆 **+10 Puntos** ganados por esta visita.\nAcumulado del mes: 160 Puntos (Puesto #1)' }
                    ]);
                    setPoints(prev => prev + 10);
                    setChatStep(0);
                    return;
                }
            };

            const simulatePhotoUpload = () => {
                const userMsg = { id: Date.now(), from: 'user', type: 'image', content: 'https://placehold.co/200x200?text=Mi+Foto', caption: 'Así quedó la góndola' };
                setMessages(prev => [...prev, userMsg]);
                setTimeout(() => {
                    processBotResponse("FOTO_ENVIADA");
                }, 1000);
            };

            // --- UI SECTIONS ---

            const renderDashboard = () => {
                const topMerchandiser = CONTACTS.reduce((prev, current) => (prev.totalVisits > current.totalVisits) ? prev : current);

                return (
                    <div className="space-y-6 animate-in fade-in">
                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-slate-500 text-sm font-bold uppercase">Visitas Hoy</h3>
                                    <div className="bg-blue-100 p-2 rounded-lg text-blue-600">{MapIcon && <MapIcon size={20}/>}</div>
                                </div>
                                <p className="text-3xl font-bold text-slate-800">142</p>
                                <p className="text-xs text-green-600 mt-1">↑ 12% vs ayer</p>
                            </div>
                             <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-slate-500 text-sm font-bold uppercase">Cobertura</h3>
                                    <div className="bg-emerald-100 p-2 rounded-lg text-emerald-600">{Target && <Target size={20}/>}</div>
                                </div>
                                <p className="text-3xl font-bold text-slate-800">85%</p>
                                <p className="text-xs text-slate-400 mt-1">Puntos cubiertos</p>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-slate-500 text-sm font-bold uppercase">Fotos Recibidas</h3>
                                    <div className="bg-purple-100 p-2 rounded-lg text-purple-600">{Camera && <Camera size={20}/>}</div>
                                </div>
                                <p className="text-3xl font-bold text-slate-800">380</p>
                                <p className="text-xs text-slate-400 mt-1">Evidencia visual</p>
                            </div>
                             <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="text-slate-500 text-sm font-bold uppercase">Activos</h3>
                                    <div className="bg-orange-100 p-2 rounded-lg text-orange-600">{Users && <Users size={20}/>}</div>
                                </div>
                                <p className="text-3xl font-bold text-slate-800">45</p>
                                <p className="text-xs text-green-600 mt-1">En campo</p>
                            </div>
                        </div>

                        {/* Middle Section: Retail Stats & Top Performer */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* Visitas por Retail Chart */}
                            <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                                <h3 className="font-bold text-slate-700 mb-6 flex items-center gap-2">
                                    {BarChart && <BarChart size={20}/>} Visitas por Retail (Mes Actual)
                                </h3>
                                <div className="space-y-4">
                                    {RETAIL_STATS.map((retail) => (
                                        <div key={retail.name}>
                                            <div className="flex justify-between text-sm mb-1">
                                                <span className="font-bold text-slate-700">{retail.name}</span>
                                                <span className="text-slate-500">{retail.visits} visitas</span>
                                            </div>
                                            <div className="w-full bg-slate-100 rounded-full h-2.5">
                                                <div 
                                                    className={`h-2.5 rounded-full ${retail.color}`} 
                                                    style={{ width: `${(retail.visits / 500) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Top Merchandiser Card */}
                            <div className="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-xl shadow-lg p-6 text-white flex flex-col items-center justify-center relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full -mr-16 -mt-16"></div>
                                <div className="relative z-10 text-center">
                                    <div className="mb-2 inline-block bg-yellow-400 text-yellow-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">
                                        Top Performer
                                    </div>
                                    <div className="w-20 h-20 bg-white rounded-full mx-auto mb-3 flex items-center justify-center text-indigo-600 font-bold text-3xl shadow-md border-4 border-indigo-300">
                                        {topMerchandiser.name.charAt(0)}
                                    </div>
                                    <h3 className="text-xl font-bold">{topMerchandiser.name}</h3>
                                    <p className="text-indigo-100 text-sm mb-4">{topMerchandiser.role}</p>
                                    
                                    <div className="grid grid-cols-2 gap-4 w-full bg-white/10 rounded-lg p-3 backdrop-blur-sm">
                                        <div>
                                            <p className="text-2xl font-bold">{topMerchandiser.totalVisits}</p>
                                            <p className="text-[10px] uppercase opacity-70">Visitas Totales</p>
                                        </div>
                                        <div>
                                            <p className="text-2xl font-bold">{topMerchandiser.streak}</p>
                                            <p className="text-[10px] uppercase opacity-70">Días Racha</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Traceability Gallery */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                <h3 className="font-bold text-slate-700 flex items-center gap-2">
                                    {ImageIcon && <ImageIcon size={18}/>} Última Evidencia Recibida
                                </h3>
                                <button className="text-blue-600 text-sm font-medium hover:underline">Galería Completa</button>
                            </div>
                            <div className="p-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                                {GALLERY.map(pic => (
                                    <div key={pic.id} className="relative group rounded-lg overflow-hidden border border-slate-200 shadow-sm cursor-pointer">
                                        <img src={pic.img} alt="Evidence" className="w-full h-40 object-cover transition-transform group-hover:scale-105" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex flex-col justify-end p-3">

                                            </div>

                                            +{pic.score} pts
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderContentManager = () => (
                <div className="space-y-6 animate-in fade-in">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-4">Gestión de Folletos Digitales</h2>
                        <p className="text-sm text-slate-500 mb-6">Asigna el folleto digital y el planograma visual correspondiente a cada cadena.</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                                    </div>

                                        <div className="flex-1">
                                            <p className="text-xs font-bold text-slate-500 mb-2 uppercase">Folleto Infaltables</p>
                                            <div className="aspect-[3/4] bg-white rounded-lg border border-slate-200 flex items-center justify-center relative group cursor-pointer overflow-hidden">
                                                <img src={assets.flyer} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity"/>
                                                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/20 transition-opacity">
                                                    <div className="bg-white p-2 rounded-full shadow-lg text-slate-700"><Upload size={16}/></div>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex-1">
                                            <p className="text-xs font-bold text-slate-500 mb-2 uppercase">Planograma (Foto Éxito)</p>
                                            <div className="aspect-[3/4] bg-white rounded-lg border border-slate-200 flex items-center justify-center relative group cursor-pointer overflow-hidden">
                                                <img src={assets.plano} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity"/>
                                                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/20 transition-opacity">
                                                    <div className="bg-white p-2 rounded-full shadow-lg text-slate-700"><Upload size={16}/></div>

            );

            const renderGamification = () => (
                <div className="space-y-6 animate-in fade-in">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <h2 className="text-xl font-bold text-slate-800 mb-4">Reglas del Juego (Configuración)</h2>
                                <div className="space-y-6">
                                    <div>
                                        <div className="flex justify-between mb-2">

                                            <span className="font-bold text-blue-600">10 pts</span>
                                        </div>
                                        <input type="range" className="w-full accent-blue-600" defaultValue="10" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="font-medium text-slate-700">Bono Racha (3 visitas/día)</label>
                                            <span className="font-bold text-blue-600">50 pts</span>
                                        </div>
                                        <input type="range" className="w-full accent-blue-600" defaultValue="50" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between mb-2">
                                            <label className="font-medium text-slate-700">Bono Semanal (Visita a todas las cadenas)</label>
                                            <span className="font-bold text-blue-600">100 pts</span>
                                        </div>
                                        <input type="range" className="w-full accent-blue-600" defaultValue="100" />
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                <h2 className="text-xl font-bold text-slate-800 mb-4">Ranking Actual</h2>
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 text-slate-500 uppercase text-xs">
                                        <tr>
                                            <th className="p-3">#</th>

                                    </div>
                                </div>
                            </div>
                        </section>

                    </div>
                </div>
            );

            // --- MAIN RENDER ---
            return (
                <div className="flex h-screen overflow-hidden font-sans text-slate-900">
                    
                    {/* LEFT: ADMIN INTERFACE */}
                    <div className="flex-1 flex flex-col md:flex-row bg-slate-100 overflow-hidden relative">
                        
                        {/* Sidebar */}
                        <aside className="w-64 bg-slate-900 text-white flex flex-col shrink-0 z-20">
                            <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">B</div>
                                <div>
                                    <h1 className="font-bold leading-none">BDF Retail</h1>
                                    <span className="text-[10px] text-slate-400">Admin Console</span>
                                </div>
                            </div>
                            <nav className="flex-1 p-4 space-y-2">
                                <button onClick={() => setView('dashboard')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {LayoutDashboard && <LayoutDashboard size={18}/>} Dashboard
                                </button>
                                <div className="pt-2 pb-1 px-4 text-xs font-semibold text-slate-500 uppercase">Gestión</div>
                                <button onClick={() => setView('crm')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'crm' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {Users && <Users size={18}/>} RRHH & Contactos
                                </button>
                                <button onClick={() => setView('routes')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'routes' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {MapPin && <MapPin size={18}/>} Sitios & Rutas
                                </button>
                                <button onClick={() => setView('content')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'content' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {FileText && <FileText size={18}/>} Gestión Contenido (Folletos)
                                </button>
                                <div className="pt-2 pb-1 px-4 text-xs font-semibold text-slate-500 uppercase">Ejecución</div>
                                <button onClick={() => setView('gamification')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'gamification' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {Trophy && <Trophy size={18}/>} Gamificación
                                </button>
                                <button onClick={() => setView('messaging')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium w-full transition-colors ${view === 'messaging' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    {MessageSquare && <MessageSquare size={18}/>} Mensajería WhatsApp
                                </button>
                                
                                {/* Proposal Button */}
                                <div className="pt-8">
                                    <button onClick={() => setView('proposal')} className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-bold w-full transition-colors border border-slate-700 ${view === 'proposal' ? 'bg-blue-600 text-white border-blue-600' : 'text-blue-300 hover:bg-slate-800 hover:text-white'}`}>
                                        {BookOpen && <BookOpen size={18}/>} Propuesta Comercial
                                    </button>
                                </div>
                            </nav>
                        </aside>

                        {/* Admin Content */}
                        <div className="flex-1 flex flex-col h-full overflow-hidden">
                            <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0">
                                <h2 className="font-bold text-slate-800 text-lg">
                                    {view === 'dashboard' && 'Panel de Control Principal'}
                                    {view === 'content' && 'Carga de Folletos & Planogramas'}
                                    {view === 'gamification' && 'Reglas de Puntos & Ranking'}
                                    {view === 'routes' && 'Mapa de Calor & Rutas'}
                                    {view === 'crm' && 'Directorio de Personal'}
                                    {view === 'messaging' && 'Campañas de Comunicación'}
                                    {view === 'proposal' && 'Propuesta de Valor BDF'}
                                </h2>
                                <div className="flex items-center gap-4">
                                    <div className="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full">
                                        {Search && <Search size={14} className="text-slate-400"/>}
                                        <input className="bg-transparent text-sm outline-none w-32" placeholder="Buscar..." />
                                    </div>
                                    <div className="w-8 h-8 rounded-full bg-slate-300"></div>
                                </div>
                            </header>
                            <div className="flex-1 overflow-y-auto p-6">
                                {view === 'dashboard' && renderDashboard()}
                                {view === 'content' && renderContentManager()}
                                {view === 'gamification' && renderGamification()}
                                {view === 'routes' && renderRoutes()}
                                {view === 'crm' && renderCRM()}
                                {view === 'messaging' && renderMessaging()}
                                {view === 'proposal' && renderProposal()}
                            </div>
                        </div>
                    </div>

                    {/* RIGHT: WHATSAPP INTERFACE (Fixed width) */}
                    <div className="w-[400px] bg-slate-200 flex flex-col shadow-2xl border-l border-slate-300 relative z-30">
                        {/* Phone Header */}
                        <div className="bg-[#005e54] p-3 text-white flex items-center gap-3 shadow-md shrink-0">
                            <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center font-bold text-[#005e54] text-lg">B</div>
                            <div className="flex-1">
                                <h3 className="font-bold text-sm">BDF Asistente 🤖</h3>
                                <p className="text-xs opacity-80">En línea • Business Account</p>
                            </div>
                            <div className="bg-[#004d44] px-2 py-1 rounded text-xs font-mono">{points} PTS</div>
                        </div>

                        {/* Chat Body */}
                        <div className="flex-1 overflow-y-auto p-4 space-y-3 chat-bg scrollbar-hide">
                            <div className="text-center text-xs text-slate-600 bg-slate-100/80 rounded-full py-1 px-3 w-fit mx-auto shadow-sm mb-4">HOY</div>
                            
                            {messages.map((msg) => (
                                <div key={msg.id} className={`flex ${msg.from === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] rounded-lg shadow-sm p-2 text-sm relative ${
                                        msg.from === 'user' ? 'bg-[#dcf8c6] text-slate-800 rounded-tr-none' : 'bg-white text-slate-800 rounded-tl-none'
                                    }`}>
                                        {msg.type === 'text' && <p className="whitespace-pre-wrap">{msg.content}</p>}
                                        {msg.type === 'image' && (
                                            <div>
                                                <img src={msg.content} alt="Attachment" className="rounded-lg mb-1 w-full" />
                                                {msg.caption && <p className="font-bold">{msg.caption}</p>}
                                            </div>
                                        )}
                                        <div className="text-[9px] text-slate-400 text-right mt-1 flex justify-end gap-1 items-center">
                                            10:42 AM {msg.from === 'user' && (CheckCircle && <CheckCircle size={10} className="text-blue-400"/>)}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <div ref={chatEndRef} />
                            
                            {/* Contextual Actions (Quick Replies) */}
                            {chatStep === 5 && (
                                <div className="flex justify-center mt-2">
                                    <button onClick={simulatePhotoUpload} className="bg-white text-slate-700 text-xs font-bold px-4 py-2 rounded-full shadow-md flex items-center gap-2 hover:bg-slate-50 transition-transform active:scale-95">
                                        {Camera && <Camera size={14}/>} Enviar Foto de Góndola
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Chat Input */}
                        <div className="p-2 bg-[#f0f0f0] shrink-0 flex items-center gap-2">
                            <input 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleSend(e)}
                                type="text" 
                                placeholder="Escribe un mensaje..." 
                                className="flex-1 rounded-full px-4 py-2 text-sm border-none focus:ring-0 focus:outline-none"
                            />
                            <button onClick={handleSend} className="bg-[#005e54] text-white p-2 rounded-full shadow-sm hover:opacity-90">
                                {Send && <Send size={18}/>}
                            </button>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BDFApp />);
    </script>
</body>
</html>
