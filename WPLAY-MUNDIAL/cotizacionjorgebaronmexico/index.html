<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wplay - Jorge Barón en México 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #080c14; color: #f1f5f9; overflow-x: hidden; }
        .tv-glow { box-shadow: 0 0 50px rgba(245, 158, 11, 0.15); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
        .action-card:hover { transform: translateY(-8px); border-color: #f59e0b; }
        .amber-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .tab-active { border-bottom: 4px solid #f59e0b; color: #f59e0b; background-color: rgba(245, 158, 11, 0.05); }
        .img-overlay { background: linear-gradient(to top, #080c14 15%, transparent 85%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                calendar: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
                mapPin: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
                mic: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>,
                zap: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
                tv: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>,
                camera: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
                star: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
                plane: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>,
                alert: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            };
            return <span className={`flex items-center justify-center ${className}`}>{icons[name]}</span>;
        };

        const App = () => {
            const [activeDay, setActiveDay] = useState(16);

            const agenda = {
                15: {
                    title: "Llegada a CDMX",
                    type: "Logística",
                    desc: "Arribo de Jorge Barón y el equipo Level al Hotel Royal Pedregal. Briefing final y scouting de locaciones estratégicas.",
                    contents: []
                },
                16: {
                    title: "Banderazo de Hinchas",
                    type: "Operación Digital",
                    desc: "Jornada intensiva en las afueras del hotel de concentración. Jorge interactúa con la marea amarilla colombiana.",
                    contents: [
                        {
                            id: 1,
                            title: "La Patadita de la Suerte Mundialista",
                            mechanical: "Mecánica: Los hinchas hacen fila usando el poncho de Wplay. Uno a uno recibe la Patadita de la Suerte de Jorge Barón y dice para qué quiere su patadita, mientras se registran las reacciones.",
                            img: "https://i.postimg.cc/QdtcP1fz/Gemini-Generated-Image-94z5br94z5br94z5.png",
                            icon: "zap"
                        },
                        {
                            id: 2,
                            title: "Tomando el Micrófono (Vox Populi)",
                            mechanical: "Mecánica: Jorge entrevista a aficionados preguntándoles marcadores y cábalas. Videos sugeridos: ¿A qué jugador le darías la patadita? ¿Marcador? ¿Amuleto? ¿Cábala? Todos con poncho de Wplay.",
                            img: "https://i.postimg.cc/yxj7MDML/Gemini-Generated-Image-agywf6agywf6agyw.png",
                            icon: "mic"
                        },
                        {
                            id: 3,
                            title: "La Cámara del Hincha (POV)",
                            mechanical: "Mecánica: Cámara dirigida al rostro de los hinchas mientras Jorge recorre la multitud. Capturamos saludos y sorpresas genuinas que genera su presencia.",
                            img: "https://i.postimg.cc/zDP7WKxL/Gemini-Generated-Image-4pj73c4pj73c4pj7.png",
                            icon: "camera"
                        }
                    ]
                },
                17: {
                    title: "Match Day: Estadio Azteca",
                    type: "Estrategia 360°",
                    desc: "Día de debut. Operación digital en cercanías del estadio y acciones tentativas en medios masivos.",
                    contents: [
                        {
                            id: 1,
                            title: "La Patadita de la Suerte en el Azteca",
                            mechanical: "Mecánica: Replicamos la fila de la suerte en la explanada del estadio antes del ingreso. Los hinchas piden su patadita para el triunfo de hoy.",
                            img: "https://i.postimg.cc/Cx1KV4Lx/Gemini-Generated-Image-cqypkjcqypkjcqyp.png",
                            icon: "zap"
                        },
                        {
                            id: 2,
                            title: "Micrófono Abierto: Previa Real",
                            mechanical: "Mecánica: Capturamos el sentimiento minutos antes del pitazo inicial. Marcadores finales y promesas extremas si ganamos el debut.",
                            img: "https://i.postimg.cc/yxj7MDML/Gemini-Generated-Image-agywf6agywf6agyw.png",
                            icon: "mic"
                        },
                        {
                            id: 3,
                            title: "POV: Emoción Pre-Partido",
                            mechanical: "Mecánica: La cámara del pecho de Jorge registra la euforia del hincha en el punto de máxima tensión deportiva.",
                            img: "https://i.postimg.cc/zDP7WKxL/Gemini-Generated-Image-4pj73c4pj73c4pj7.png",
                            icon: "camera"
                        },
                        {
                            id: 4,
                            title: "ACCIÓN TENTATIVA: Crossover RCN",
                            mechanical: "Mecánica (Sujeta a tiempos): Buscaremos que Jorge esté en la previa oficial de RCN con Juan Felipe Cadavid y Eduardo Luis.",
                            img: "https://i.postimg.cc/05hQxm5V/Gemini-Generated-Image-i9fe8gi9fe8gi9fe.png",
                            icon: "tv",
                            isTentative: true
                        },
                        {
                            id: 5,
                            title: "ACCIÓN TENTATIVA: Saludo Pro",
                            mechanical: "Mecánica (Sujeta a logística): Intentaremos el saludo de un jugador de la Selección validando la suerte de Jorge ante el país.",
                            img: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80&w=800",
                            icon: "star",
                            isTentative: true
                        }
                    ]
                },
                18: {
                    title: "Regreso a Bogotá",
                    type: "Logística",
                    desc: "Cierre de operación y retorno de la leyenda a suelo colombiano tras un debut cargado de entusiasmo.",
                    contents: []
                }
            };

            const current = agenda[activeDay];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
                    {/* Header Principal */}
                    <div className="flex flex-col lg:flex-row justify-between items-center gap-8 mb-12 border-b border-slate-800 pb-8">
                        <div className="border-l-8 border-amber-500 pl-8">
                            <h4 className="text-amber-500 font-black uppercase text-[10px] tracking-[0.6em] mb-2 leading-none italic">Hoja de Ruta: Jorge Barón</h4>
                            <h1 className="text-5xl md:text-7xl font-black italic text-white uppercase tracking-tighter leading-none">MÉXICO<br/><span className="text-slate-500">ACTION HUB</span></h1>
                        </div>
                        <div className="bg-slate-900 p-2 rounded-[2.5rem] border border-slate-700 tv-glow overflow-hidden relative group">
                            <img src="https://i.postimg.cc/MGMNxk8R/5906715ac83ac.jpg" className="h-44 w-64 object-cover rounded-[2rem] transition-transform duration-700 group-hover:scale-105" alt="Jorge Baron" />
                            <div className="absolute bottom-6 right-6 bg-red-600 text-white font-black px-3 py-1 rounded-lg text-[9px] uppercase tracking-widest flex items-center gap-2">
                                <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span> Live CDMX
                            </div>
                        </div>
                    </div>

                    {/* Navegación por Días */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-4 mb-12">
                        {[15, 16, 17, 18].map((day) => (
                            <button 
                                key={day}
                                onClick={() => setActiveDay(day)}
                                className={`p-6 rounded-[2rem] border-2 transition-all flex flex-col items-center gap-1 ${activeDay === day ? 'tab-active border-amber-500' : 'bg-slate-900/40 border-slate-800 text-slate-500 hover:border-slate-600 hover:text-white'}`}
                            >
                                <div className="flex items-center gap-2">
                                    <Icon name={day === 15 || day === 18 ? "plane" : "calendar"} className={`w-3 h-3 ${activeDay === day ? 'text-amber-500' : 'opacity-30'}`} />
                                    <span className="font-black text-xs uppercase tracking-widest leading-none italic">Junio {day}</span>
                                </div>
                                <span className={`text-[10px] font-bold uppercase tracking-tighter ${activeDay === day ? 'text-white' : 'opacity-40'}`}>
                                    {day === 15 ? "Llegada" : day === 16 ? "Banderazo" : day === 17 ? "Partido" : "Regreso"}
                                </span>
                            </button>
                        ))}
                    </div>

                    {/* Área de Contenido Principal */}
                    <div className="animate-in fade-in slide-in-from-bottom-4 duration-700">
                        <div className="bg-slate-900/50 border border-slate-800 rounded-[3rem] p-10 mb-12 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-12 opacity-5"><Icon name="mapPin" className="w-48 h-48" /></div>
                            <div className="relative z-10">
                                <div className="flex items-center gap-3 mb-4">
                                    <span className="px-4 py-1 rounded-full bg-amber-500 text-slate-900 font-black text-[9px] uppercase tracking-widest italic">{current.type}</span>
                                    <span className="text-slate-500 font-bold text-xs uppercase tracking-widest italic">CDMX / Estadio Azteca</span>
                                </div>
                                <h2 className="text-4xl md:text-5xl font-black italic uppercase text-white mb-4 tracking-tighter">{current.title}</h2>
                                <p className="text-slate-400 max-w-3xl text-base leading-relaxed italic border-l-2 border-amber-500/30 pl-6">
                                    "{current.desc}"
                                </p>
                            </div>
                        </div>

                        {/* Grid de Contenidos del Día */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                            {current.contents.length > 0 ? current.contents.map((content, idx) => (
                                <div key={idx} className={`action-card bg-slate-900 border-2 rounded-[3.5rem] p-10 flex flex-col transition-all duration-500 overflow-hidden ${content.isTentative ? 'border-dashed border-slate-700 opacity-90' : 'border-slate-800'}`}>
                                    <div className="flex justify-between items-start mb-8">
                                        <div className={`w-12 h-12 rounded-2xl bg-slate-800 border flex items-center justify-center shadow-xl group-hover:scale-110 transition-transform ${content.isTentative ? 'text-slate-500 border-slate-700' : 'text-amber-500 border-slate-700'}`}>
                                            <Icon name={content.icon} />
                                        </div>
                                        <div className="flex flex-col items-end">
                                            <span className="text-[9px] font-black text-slate-500 uppercase tracking-widest border border-slate-800 px-3 py-1 rounded-full mb-2">Item 0{idx + 1}</span>
                                            {content.isTentative && <span className="text-[8px] font-black text-red-500 uppercase tracking-widest flex items-center gap-1"><Icon name="alert" className="w-2 h-2" /> Tentativo</span>}
                                        </div>
                                    </div>
                                    
                                    <h3 className="text-2xl font-black text-white uppercase italic mb-6 tracking-tighter leading-none">{content.title}</h3>
                                    
                                    <div className="bg-black/40 p-6 rounded-[2rem] border border-white/5 mb-8 flex-grow">
                                        <p className="text-[12px] text-slate-300 leading-relaxed italic">
                                            {content.mechanical}
                                        </p>
                                    </div>

                                    <div className="h-56 w-full rounded-[2.5rem] overflow-hidden border border-slate-800 bg-slate-950 mb-8 relative shadow-2xl">
                                        <img src={content.img} className="w-full h-full object-cover opacity-100 transition-all duration-700" alt={content.title} />
                                        <div className="absolute inset-0 img-overlay opacity-60"></div>
                                    </div>

                                    <div className={`w-full py-4 text-slate-900 font-black text-[10px] uppercase rounded-2xl tracking-[0.3em] shadow-xl text-center shadow-amber-500/10 italic ${content.isTentative ? 'bg-slate-700 text-slate-300 opacity-50' : 'amber-gradient'}`}>
                                        Imagen de Referencia
                                    </div>
                                </div>
                            )) : (
                                <div className="col-span-full py-24 flex flex-col items-center justify-center opacity-30 border-2 border-dashed border-slate-800 rounded-[3rem]">
                                    <Icon name="plane" className="w-16 h-16 mb-4 text-amber-500" />
                                    <p className="font-black text-xs uppercase tracking-widest italic">Movimiento Logístico / Traslados</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="mt-40 py-12 border-t border-slate-800 flex flex-col md:flex-row justify-between items-center gap-8 text-[11px] font-bold text-slate-600 uppercase tracking-[0.4em]">
                        <div className="flex gap-12">
                            <span className="flex items-center gap-3 italic"><Icon name="mic" className="w-4 h-4 text-amber-500" /> Entusiasmo en CDMX</span>
                            <span className="flex items-center gap-3 italic"><Icon name="star" className="w-4 h-4 text-amber-500" /> Wplay.co Exclusive</span>
                        </div>
                        <span className="text-amber-500 font-black italic">Level Colombia x Jorge Barón TV</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
