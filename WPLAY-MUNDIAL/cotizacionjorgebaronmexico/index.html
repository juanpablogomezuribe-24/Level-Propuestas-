<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerario Viaje Jorge Barón - Mundial 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .activity-card:hover .icon-box { background-color: #2563eb; color: white; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-20">
    <div class="bg-blue-900 h-2 w-full"></div>

    <div class="max-w-5xl mx-auto p-4 md:p-10 bg-white shadow-2xl min-h-screen border-x border-slate-100">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-12">
            <div class="space-y-2">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 w-12 h-12 flex items-center justify-center rounded-2xl shadow-lg shadow-blue-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <h1 class="text-3xl font-black text-blue-950 tracking-tight italic uppercase">Itinerario de Viaje</h1>
                </div>
                <p class="text-slate-500 font-medium ml-1 flex items-center gap-2">
                    <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest">Mundial 2026</span>
                    <span class="text-slate-300">|</span>
                    México (CDMX) | 15 - 18 Jun
                </p>
            </div>
            
            <div class="hidden md:block">
                <div class="text-right">
                    <p class="text-[10px] font-black text-blue-600 uppercase tracking-[0.2em] mb-1">Pasajero Principal</p>
                    <p class="text-lg font-bold text-blue-950 italic">Jorge Barón</p>
                </div>
            </div>
        </header>

        <!-- Navegación de Días -->
        <div class="flex items-center gap-3 mb-10 overflow-x-auto py-2 scrollbar-hide" id="tab-container"></div>

        <!-- Contenido del Itinerario -->
        <div class="animate-in fade-in duration-500">
            <div class="bg-white border border-slate-200 rounded-[2.5rem] shadow-sm overflow-hidden">
                <div class="p-8 bg-slate-50 border-b border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 id="day-title" class="text-2xl font-black text-blue-950 uppercase italic tracking-tighter">Cargando itinerario...</h2>
                        <p id="day-subtitle" class="text-sm text-slate-500 font-medium mt-1">Detalle logístico y actividades programadas</p>
                    </div>
                    <div class="flex items-center gap-2 bg-blue-100 text-blue-700 px-4 py-2 rounded-2xl text-xs font-black uppercase">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Operación Confirmada
                    </div>
                </div>

                <div id="activity-list" class="divide-y divide-slate-100">
                    <!-- Las actividades se inyectan aquí -->
                </div>
            </div>
        </div>

        <footer class="mt-20 pt-8 border-t border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4 text-slate-400 text-[10px] font-black uppercase tracking-[0.2em]">
            <p>Propuesta Hecha por Level Colombia</p>
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-blue-600"></div>
                <span>MUNDIAL 2026</span>
            </div>
        </footer>
    </div>

    <script>
        let activeTab = '15';

        const ITINERARY_DATA = {
            '15': {
                title: "Viaje de ida + Acomodación",
                activities: [
                    { icon: 'car', time: 'Mañana', title: "Traslado Jorge (BOG)", desc: "Recogida y transporte privado hacia el Aeropuerto El Dorado." },
                    { icon: 'plane', time: '02:15 PM', title: "Vuelo Bogotá - CDMX", desc: "Vuelo directo vía Avianca. Jorge Barón en Primera Clase, acompañantes en Clase Económica." },
                    { icon: 'car', time: '06:05 PM', title: "Llegada y Traslado CDMX", desc: "Recogida en Aeropuerto Benito Juárez y traslado grupal al hotel." },
                    { icon: 'hotel', time: 'Noche', title: "Check-in Hotel Royal Pedregal", desc: "Acomodación en 4 habitaciones individuales. Calificación 8.8/10." },
                    { icon: 'utensils', time: 'Noche', title: "Cena: Restaurante Rocasal", desc: "Experiencia gastronómica gourmet. Incluye traslados privados ida y vuelta.", link: "https://rocasal.mx/wp-content/uploads/2025/07/ALIMENTOS.pdf" }
                ]
            },
            '16': {
                title: "Día de Banderazo",
                activities: [
                    { icon: 'coffee', time: 'Mañana', title: "Desayuno Buffet", desc: "Servicio completo dentro de las instalaciones del hotel." },
                    { icon: 'utensils', time: 'Tarde', title: "Almuerzo: El Bajío", desc: "Restaurante tradicional en Paseo de la Reforma.", link: "https://www.restauranteelbajio.com.mx/uploads/comidas.pdf?uid=9c7b784ea6df3d0081024c3a40f731c4" },
                    { icon: 'users', time: 'Tarde', title: "Banderazo de la Selección", desc: "Transporte privado ida y vuelta al hotel de concentración para el apoyo a la Selección Colombia." },
                    { icon: 'beer', time: 'Tarde', title: "Social y Snacks", desc: "Espacio de integración y bebidas durante los eventos del día." },
                    { icon: 'utensils', time: 'Noche', title: "Cena: Restaurante Niza", desc: "Ubicado en la zona de Pedregal.", link: "https://www.niza.mx/" }
                ]
            },
            '17': {
                title: "⚽ Día del Partido",
                activities: [
                    { icon: 'coffee', time: 'Mañana', title: "Desayuno Energético", desc: "Servicio matutino en el hotel previo a la jornada de estadio." },
                    { icon: 'beer', time: 'Mañana', title: "Mañana de Piscina", desc: "Tiempo libre y snacks en el área social del hotel." },
                    { icon: 'utensils', time: '12:00 PM', title: "Almuerzo de Grupo", desc: "Menú ejecutivo programado en el restaurante del hotel." },
                    { icon: 'car', time: 'Tarde', title: "Logística Estadio Azteca", desc: "Traslado coordinado hacia el Coloso de Santa Úrsula." },
                    { icon: 'ticket', time: 'Evento', title: "COLOMBIA vs UZBEKISTÁN", desc: "Acceso al estadio con boletas Categoría 3. Disfrute del partido del Mundial." },
                    { icon: 'utensils', time: 'Noche', title: "Cena Post-Partido", desc: "Alimentación y bebidas en los alrededores del estadio o regreso al hotel." },
                    { icon: 'car', time: 'Noche', title: "Regreso al Hotel", desc: "Transporte privado de retorno para descanso tras la jornada deportiva." }
                ]
            },
            '18': {
                title: "Regreso a Bogotá",
                activities: [
                    { icon: 'coffee', time: 'Mañana', title: "Desayuno de Cierre", desc: "Último servicio en el Hotel Royal Pedregal." },
                    { icon: 'car', time: 'Mediodía', title: "Traslado al Aeropuerto", desc: "Transporte privado del hotel al Aeropuerto de Ciudad de México." },
                    { icon: 'plane', time: '02:00 PM', title: "Vuelo CDMX - Bogotá", desc: "Vuelo de retorno vía Avianca con llegada estimada a las 7:00 PM." },
                    { icon: 'utensils', time: 'Noche', title: "Llegada y Alimentación", desc: "Cierre de itinerario con alimentación en el Aeropuerto El Dorado." }
                ]
            }
        };

        const icons = {
            plane: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-1.1.1-1.5.5l-.3.3c-.4.4-.5 1-.3 1.5L9 12l-3.1 3.1-2-.8c-.4-.1-.9 0-1.2.3l-.3.3c-.4.4-.4 1.1 0 1.5L7 21l4.6-4.6.3-.3c.3-.3.4-.8.3-1.2l-.8-2L14.5 10l8.2 1.8c.5.1 1.1-.1 1.5-.5l.3-.3c.4-.4.5-1 .3-1.5Z"/></svg>',
            car: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>',
            hotel: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22v-6.57"/><path d="M12 11h.01"/><path d="M12 7h.01"/><path d="M14 15.43V22"/><path d="M15 16a5 5 0 0 0-6 0"/><path d="M16 11h.01"/><path d="M16 7h.01"/><path d="M18 22V8a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14"/><path d="M20 22h2"/><path d="M22 22v-4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v4"/><path d="M2 22h2"/><path d="M8 11h.01"/><path d="M8 7h.01"/></svg>',
            utensils: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
            coffee: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',
            beer: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M7 10h10v10a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2Z"/><path d="M6 2h12a2 2 0 0 1 2 2v3H4V4a2 2 0 0 1 2-2Z"/></svg>',
            ticket: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>',
            users: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
        };

        function render() {
            // Render Tabs
            const tabContainer = document.getElementById('tab-container');
            tabContainer.innerHTML = Object.keys(ITINERARY_DATA).map(day => {
                const isActive = activeTab === day;
                return `
                    <button onclick="activeTab='${day}'; render();" class="px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest transition-all whitespace-nowrap ${isActive ? 'bg-blue-950 text-white shadow-xl scale-105 border-b-4 border-blue-600' : 'bg-white text-slate-400 border border-slate-200 hover:border-blue-300'}">
                        ${day} Junio ${day === '17' ? '⚽' : ''}
                    </button>
                `;
            }).join('');

            // Day Info
            const currentData = ITINERARY_DATA[activeTab];
            document.getElementById('day-title').textContent = `Día ${activeTab === '15' ? '1' : activeTab === '16' ? '2' : activeTab === '17' ? '3' : '4'}: ${currentData.title}`;

            // Render Activities
            const activityList = document.getElementById('activity-list');
            activityList.innerHTML = currentData.activities.map(activity => `
                <div class="activity-card flex flex-col md:flex-row gap-6 p-8 transition-all hover:bg-slate-50">
                    <div class="flex flex-col items-center gap-2 md:w-24 shrink-0">
                        <span class="text-[10px] font-black text-blue-600 uppercase tracking-widest">${activity.time}</span>
                        <div class="icon-box w-12 h-12 rounded-2xl bg-white border border-slate-200 flex items-center justify-center text-blue-600 shadow-sm transition-colors">
                            ${icons[activity.icon]}
                        </div>
                    </div>
                    <div class="flex-1 space-y-2">
                        <div class="flex items-center gap-3">
                            <h3 class="text-xl font-bold text-blue-950">${activity.title}</h3>
                            ${activity.link ? `<a href="${activity.link}" target="_blank" class="text-blue-500 hover:text-blue-700"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>` : ''}
                        </div>
                        <p class="text-slate-500 leading-relaxed font-medium">${activity.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        window.onload = render;
    </script>
</body>
</html>
