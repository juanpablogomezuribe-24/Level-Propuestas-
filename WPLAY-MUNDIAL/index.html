                                            <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-700/50">
                                                <h5 className="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Desglose de Producción</h5>
                                                <span className="text-[11px] font-black text-amber-500 uppercase tracking-tighter">Total: {group.total}</span>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                {group.breakdown.map((item, ii) => (
                                                    <div key={ii} className="flex justify-between items-center bg-slate-800/40 p-2 rounded-xl border border-slate-700/30">
                                                        <span className="text-[9px] text-slate-300 font-bold uppercase">{item.label}</span>
                                                        <span className="text-[11px] font-black text-white">x{item.val}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Panel Métricas Finales */}
                            <div className="bg-slate-800 p-8 rounded-[3rem] border border-slate-700 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-96 h-96 bg-amber-500/5 blur-[100px] rounded-full -mr-48 -mt-48"></div>
                                <div className="relative z-10 flex flex-col md:flex-row items-center justify-between gap-10">
                                    <div className="text-center md:text-left">
                                        <h3 className="text-3xl font-black italic tracking-tighter text-white uppercase mb-3 leading-none">TOTAL ENTREGABLES FASE DE GRUPOS</h3>
                                        <p className="text-slate-400 text-sm max-w-md italic">Proyección final de piezas de video producidas y editadas durante los 14 días de operación.</p>
                                    </div>
                                    <div className="flex flex-wrap justify-center gap-6 text-white">
                                        <div className="bg-slate-900 p-8 rounded-3xl border border-slate-700 min-w-[200px] text-center shadow-xl">
                                            <p className="text-[11px] font-black text-amber-500 uppercase tracking-[0.3em] mb-2">GRAN TOTAL</p>
                                            <p className="text-7xl font-black italic leading-none tracking-tighter">20</p>
                                            <p className="text-[10px] text-slate-500 mt-3 font-bold uppercase">VIDEOS PRODUCIDOS</p>
                                        </div>
                                        <div className="bg-slate-900 p-8 rounded-3xl border border-slate-700 min-w-[200px] text-center shadow-xl">
                                            <p className="text-[11px] font-black text-amber-500 uppercase tracking-[0.3em] mb-2">PERSONAL</p>
                                            <p className="text-7xl font-black italic leading-none tracking-tighter">03</p>
                                            <p className="text-[10px] text-slate-500 mt-3 font-bold uppercase">EQUIPO NIVEL/FSL</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        /* VISTA DETALLADA */
                        <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-1 bg-slate-800/80 backdrop-blur-md rounded-3xl p-6 border border-slate-700 shadow-2xl h-[750px] flex flex-col">
                                <h3 className="flex items-center gap-2 font-black mb-6 text-slate-300 text-xs uppercase tracking-widest">
                                    <Icon name="Calendar" className="w-5 h-5 text-amber-500" /> RUTA CRONOLÓGICA
                                </h3>
                                <div className="overflow-y-auto pr-2 space-y-2 custom-scrollbar text-white">
                                    {itinerary.map((day, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => setActiveDay(idx)}
                                            className={`w-full flex items-center p-3 rounded-2xl transition-all border ${
                                                activeDay === idx 
                                                    ? 'bg-amber-500 border-amber-400 text-slate-900 scale-[1.03] shadow-lg font-bold' 
                                                    : 'bg-slate-700/40 border-slate-600/50 hover:bg-slate-700 text-slate-400'
                                            }`}
                                        >
                                            <div className="w-10 text-left text-[10px] font-black uppercase opacity-60 leading-none">{day.date}</div>
                                            <div className="flex-1 text-xs truncate text-left font-bold">{day.title}</div>
                                            {day.type === 'partido' && <Icon name="Trophy" className={activeDay === idx ? 'w-4 h-4 text-slate-900' : 'w-4 h-4 text-red-500'} />}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="lg:col-span-2 space-y-6">
                                <div className="bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-xl overflow-hidden relative min-h-[750px]">
                                    <div className="flex items-center justify-between mb-4">
                                        <div className="flex items-center gap-2 text-[10px] font-black uppercase text-amber-500 tracking-widest">
                                            <Icon name="MapPin" className="w-4 h-4" /> {itinerary[activeDay].city}
                                        </div>
                                        <span className={`px-3 py-1 rounded-lg text-[9px] font-black uppercase tracking-widest border ${
                                            itinerary[activeDay].type === 'partido' ? 'bg-red-500/10 border-red-500 text-red-500' : 
                                            itinerary[activeDay].type === 'produccion' ? 'bg-amber-500/10 border-amber-500 text-amber-500' : 'bg-slate-600/10 border-slate-500 text-slate-400'
                                        }`}>
                                            {itinerary[activeDay].type}
                                        </span>
                                    </div>
                                    
                                    <h2 className="text-4xl font-black mb-4 tracking-tighter italic uppercase text-white leading-none">
                                        {itinerary[activeDay].title}
                                    </h2>
                                    <p className="text-slate-400 text-sm leading-relaxed mb-8 max-w-xl italic border-l-2 border-slate-600 pl-4">
                                        "{itinerary[activeDay].description}"
                                    </p>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        {itinerary[activeDay].contents.map((content, i) => {
                                            const info = contentTypes[content.type];
                                            return (
                                                <div key={i} className="bg-slate-900 border border-slate-700 rounded-[2.5rem] overflow-hidden flex flex-col hover:border-amber-500 transition-all group shadow-2xl">
                                                    <div className="aspect-9-16 overflow-hidden relative bg-slate-950">
                                                        <img src={content.img} alt={info.name} className="w-full h-full object-cover object-top group-hover:scale-105 transition-transform duration-1000" />
                                                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-black/30"></div>
                                                        <div className="absolute top-4 left-4 right-4 flex justify-between items-center">
                                                            <div className="bg-black/60 backdrop-blur-md p-2 rounded-xl border border-white/10">
                                                                <Icon name={info.icon} className={`w-5 h-5 ${info.color}`} />
                                                            </div>
                                                            <span className="text-[10px] font-black bg-amber-500 px-2 py-1 rounded-md text-slate-900 border border-amber-400">
                                                                {content.format}
                                                            </span>
                                                        </div>
                                                        <div className="absolute bottom-6 left-6 right-6">
                                                            <h4 className="font-black text-2xl text-white mb-4 uppercase italic tracking-tighter drop-shadow-lg leading-tight">{info.name}</h4>
                                                            <div className="bg-black/40 backdrop-blur-md p-4 rounded-2xl border border-white/10 mb-4">
                                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1 font-bold tracking-widest">Gancho sugerido:</p>
                                                                <p className="text-xs italic text-slate-100 font-medium leading-snug">"{content.hook}"</p>
                                                            </div>
                                                            <a href={content.ref} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full py-3 bg-white text-slate-900 rounded-2xl font-black text-xs uppercase hover:bg-amber-500 transition-all shadow-xl active:scale-95">
                                                                <Icon name="ExternalLink" className="w-4 h-4 text-slate-900" /> Ver Referencia FSL
                                                            </a>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {itinerary[activeDay].contents.length === 0 && (
                                            <div className="md:col-span-2 py-32 text-center border-2 border-dashed border-slate-700 rounded-3xl opacity-50 bg-slate-800/20">
                                                <Icon name="Plane" className="w-12 h-12 mx-auto text-slate-600 mb-4" />
                                                <p className="text-slate-500 font-black uppercase text-xs tracking-[0.3em]">Operación Logística</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
