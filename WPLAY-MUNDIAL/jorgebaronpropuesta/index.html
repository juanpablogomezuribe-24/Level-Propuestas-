<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wplay - Estrategia Jorge Barón Mundial 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #080c14; color: #f1f5f9; overflow-x: hidden; }
        .tv-glow { box-shadow: 0 0 50px rgba(245, 158, 11, 0.2); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #f59e0b; border-radius: 10px; }
        .action-card:hover { transform: translateY(-8px); border-color: #f59e0b; }
        .amber-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .wa-gradient { background: linear-gradient(135deg, #25d366 0%, #128c7e 100%); }
        .tab-active { border-bottom: 4px solid #f59e0b; color: #f59e0b; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                strategy: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>,
                mexico: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
                ambassadors: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
                wa: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.38 8.38 0 0 1 3.8.9L21 3z"/></svg>,
                kpi: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>,
                mic: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            };
            return <span className={`flex items-center justify-center ${className}`}>{icons[name]}</span>;
        };

        const App = () => {
            const [currentTab, setCurrentTab] = useState('strategy');

            const ambassadors = [
                { name: "Sheyla García", capsule: "¿Por qué no fue gol de Yepes?", detail: "Porque nos faltó la patadita de la buena suerte.", img: "https://i.postimg.cc/K851krVZ/sheyla_garcia_2.jpg" },
                { name: "Juan Felipe Cadavid", capsule: "¿Qué le falta a Colombia para ganar?", detail: "Ese empujón final del entusiasmo de Jorge.", img: "https://i.postimg.cc/PNsjK9CK/juan_felipe_cadavid_2.webp" },
                { name: "Eduardo Luis", capsule: "¿A quién le daría la patadita?", detail: "Relato épico de a quién mandaría a volar de la suerte.", img: "https://i.postimg.cc/Y9Bnj7m1/eduardo_luis.avif" }
            ];

            const mexicoActions = [
                { id: 1, title: "Vox Populi", desc: "Entrevistas a hinchas en Banderazo y Azteca sobre amuletos y cábalas.", img: "https://i.postimg.cc/yxj7MDML/Gemini-Generated-Image-agywf6agywf6agyw.png" },
                { id: 2, title: "Reto Patadita", desc: "Contrarreloj de pataditas a hinchas colombianos relacionado con apuestas Wplay.", img: "https://i.postimg.cc/Cx1KV4Lx/Gemini-Generated-Image-cqypkjcqypkjcqyp.png" },
                { id: 3, title: "Cámara del Hincha", desc: "POV desde el pecho de Jorge viendo las reacciones de felicidad tricolor.", img: "https://i.postimg.cc/zDP7WKxL/Gemini-Generated-Image-4pj73c4pj73c4pj7.png" },
                { id: 4, title: "Banderazo Suerte", desc: "El hincha escribe su amuleto en la gran bandera Wplay que Jorge supervisa.", img: "https://images.unsplash.com/photo-1533928298208-27ff66555d8d?auto=format&fit=crop&q=80&w=800" },
                { id: 5, title: "Agüita para mi gente", desc: "Jorge refrescando a los hinchas y lanzando bonos sorpresa físicos y digitales.", img: "https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&q=80&w=800" },
                { id: 6, title: "Collar de la Suerte", desc: "Jorge coloca personalmente el dije a los hinchas con más fe o que se dejan dar la patadita.", img: "https://i.postimg.cc/KcPj7zH3/Gemini-Generated-Image-h3idmzh3idmzh3id.png" }
            ];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto selection:bg-amber-500">
                    {/* Brand Header */}
                    <div className="flex flex-col lg:flex-row justify-between items-center gap-8 mb-12 border-b border-slate-800 pb-8">
                        <div className="border-l-8 border-amber-500 pl-8">
                            <h4 className="text-amber-500 font-black uppercase text-[10px] tracking-[0.6em] mb-2 leading-none">Level Agency x Wplay.co</h4>
                            <h1 className="text-5xl md:text-7xl font-black italic text-white uppercase tracking-tighter leading-none mb-2">Jorge Barón<br/><span className="text-slate-500">Action Hub</span></h1>
                        </div>
                        <div className="bg-slate-900 p-2 rounded-[2rem] border border-slate-700 tv-glow">
                            <img src="https://i.postimg.cc/MGMNxk8R/5906715ac83ac.jpg" className="h-40 w-64 object-cover rounded-[1.5rem]" alt="Jorge Baron" />
                        </div>
                    </div>

                    {/* Main Tab Navigation */}
                    <div className="flex flex-wrap justify-center gap-2 md:gap-8 mb-12 border-b border-slate-800">
                        <button onClick={() => setCurrentTab('strategy')} className={`pb-4 px-6 font-black uppercase text-xs tracking-widest transition-all ${currentTab === 'strategy' ? 'tab-active' : 'text-slate-500 hover:text-white'}`}>
                           01. Estrategia General
                        </button>
                        <button onClick={() => setCurrentTab('mexico')} className={`pb-4 px-6 font-black uppercase text-xs tracking-widest transition-all ${currentTab === 'mexico' ? 'tab-active' : 'text-slate-500 hover:text-white'}`}>
                           02. Jorge en México
                        </button>
                        <button onClick={() => setCurrentTab('ambassadors')} className={`pb-4 px-6 font-black uppercase text-xs tracking-widest transition-all ${currentTab === 'ambassadors' ? 'tab-active' : 'text-slate-500 hover:text-white'}`}>
                           03. Cápsulas Embajadores
                        </button>
                    </div>

                    {/* TAB 1: STRATEGY */}
                    {currentTab === 'strategy' && (
                        <div className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mb-16">
                                <div className="space-y-8">
                                    <div className="bg-slate-900 border border-slate-800 p-10 rounded-[3rem] shadow-2xl">
                                        <div className="flex items-center gap-4 mb-6">
                                            <div className="w-12 h-12 wa-gradient rounded-2xl flex items-center justify-center text-white shadow-lg">
                                                <Icon name="wa" />
                                            </div>
                                            <h2 className="text-3xl font-black italic uppercase tracking-tight">El Motor: WhatsApp</h2>
                                        </div>
                                        <p className="text-slate-400 text-lg leading-relaxed mb-8 italic">
                                            "Todos los caminos conducen a la Patadita de la Buena Suerte digital. WhatsApp será el único puerto de aterrizaje donde la esencia de Wplay se activa."
                                        </p>
                                        <div className="bg-black/40 p-6 rounded-3xl border border-white/5 space-y-4">
                                            <p className="text-sm font-bold text-amber-500 uppercase tracking-widest">El Flujo de Conversión:</p>
                                            <ul className="space-y-3 text-sm text-slate-300">
                                                <li className="flex gap-3">● <span className="font-bold text-white uppercase">Omnicanalidad:</span> TV, vallas en aeropuertos y digital llevan a un QR único.</li>
                                                <li className="flex gap-3">● <span className="font-bold text-white uppercase">El Incentivo:</span> Al entrar al chat, el usuario recibe "La Patadita de Jorge" (Bono Wplay).</li>
                                                <li className="flex gap-3">● <span className="font-bold text-white uppercase">Activación:</span> Redención inmediata para primera apuesta o reactivación de cuentas.</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-6">
                                    <div className="bg-slate-900/50 p-8 rounded-[2.5rem] border border-slate-800">
                                        <Icon name="kpi" className="text-amber-500 mb-4 w-10 h-10" />
                                        <h4 className="font-black uppercase text-xs mb-4 text-white">KPIs de Crecimiento</h4>
                                        <ul className="text-[10px] space-y-2 text-slate-400 font-bold uppercase tracking-tighter">
                                            <li>• Nuevos Registros</li>
                                            <li>• Primeras Apuestas</li>
                                            <li>• Recargas Efectivas</li>
                                        </ul>
                                    </div>
                                    <div className="bg-slate-900/50 p-8 rounded-[2.5rem] border border-slate-800">
                                        <Icon name="strategy" className="text-amber-500 mb-4 w-10 h-10" />
                                        <h4 className="font-black uppercase text-xs mb-4 text-white">Salud de Marca</h4>
                                        <ul className="text-[10px] space-y-2 text-slate-400 font-bold uppercase tracking-tighter">
                                            <li>• Retención de Usuarios</li>
                                            <li>• Reputación Orgánica</li>
                                            <li>• Sincronía Branding</li>
                                        </ul>
                                    </div>
                                    <div className="col-span-2 bg-amber-500 p-8 rounded-[2.5rem] shadow-xl text-slate-900 flex items-center justify-between overflow-hidden relative">
                                        <div className="relative z-10">
                                            <p className="font-black uppercase text-[10px] tracking-widest mb-1 opacity-70 italic">Cierre del Ciclo</p>
                                            <h3 className="text-3xl font-black italic uppercase leading-none">Conversión<br/>Garantizada</h3>
                                        </div>
                                        <Icon name="wa" className="w-24 h-24 opacity-20 relative -right-4" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 2: MEXICO */}
                    {currentTab === 'mexico' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 animate-in fade-in duration-500">
                            {mexicoActions.map((act) => (
                                <div key={act.id} className="action-card bg-slate-900 border-2 border-slate-800 rounded-[3rem] p-8 flex flex-col transition-all duration-300">
                                    <div className="h-48 w-full rounded-[2rem] overflow-hidden mb-6 relative">
                                        <img src={act.img} className="w-full h-full object-cover grayscale opacity-60 hover:grayscale-0 hover:opacity-100 transition-all duration-700" alt={act.title} />
                                        <div className="absolute top-4 left-4 bg-amber-500 text-slate-900 px-3 py-1 rounded-xl text-[10px] font-black uppercase">Acción 0{act.id}</div>
                                    </div>
                                    <h3 className="text-xl font-black text-white uppercase italic mb-3 tracking-tighter">{act.title}</h3>
                                    <p className="text-slate-400 text-xs leading-relaxed mb-6 italic">"{act.desc}"</p>
                                    <div className="mt-auto pt-4 border-t border-slate-800 text-[10px] font-black text-amber-500 uppercase tracking-widest text-center">Imagen de referencia</div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* TAB 3: AMBASSADORS */}
                    {currentTab === 'ambassadors' && (
                        <div className="animate-in fade-in slide-in-from-right-4 duration-500">
                            <div className="bg-slate-900 border border-slate-800 p-10 rounded-[3.5rem] mb-12 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-12 opacity-5"><Icon name="mic" className="w-48 h-48" /></div>
                                <div className="relative z-10">
                                    <h2 className="text-4xl font-black italic uppercase text-white mb-4">Crossover de Medios</h2>
                                    <p className="text-slate-400 max-w-2xl text-sm leading-relaxed italic">
                                        Inspirados en la campaña "Fichaje Nacional", aprovecharemos el rodaje de TV para generar cápsulas digitales nativas con los embajadores FSL. Nostalgia, humor y fe en 9:16.
                                    </p>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {ambassadors.map((amb, i) => (
                                    <div key={i} className="group bg-slate-900 border border-slate-800 rounded-[3rem] p-10 flex flex-col items-center text-center hover:border-amber-500 transition-all duration-500 shadow-2xl">
                                        <div className="w-40 h-40 rounded-full overflow-hidden mb-8 border-4 border-slate-800 group-hover:border-amber-500 transition-all shadow-xl">
                                            <img src={amb.img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" alt={amb.name} />
                                        </div>
                                        <h4 className="text-2xl font-black text-white uppercase italic tracking-tighter mb-2">{amb.name}</h4>
                                        <div className="bg-black/60 p-5 rounded-2xl border border-white/5 w-full mb-6">
                                            <p className="text-amber-500 font-black text-[9px] uppercase tracking-widest mb-2 italic">Cápsula Digital:</p>
                                            <p className="text-xs font-bold text-white leading-snug">"{amb.capsule}"</p>
                                        </div>
                                        <p className="text-[10px] text-slate-500 italic uppercase font-bold tracking-tight">Concepto: {amb.detail}</p>
                                    </div>
                                ))}
                            </div>

                            <div className="mt-12 bg-slate-950/50 p-8 rounded-[2.5rem] border border-dashed border-slate-700 text-center">
                                <p className="text-slate-500 text-[10px] uppercase font-black tracking-widest mb-4">Referencia de Campaña (Aguila Fichaje Nacional)</p>
                                <div className="flex flex-wrap justify-center gap-4">
                                    <a href="https://www.instagram.com/p/DUgNgbHjkyc/" target="_blank" className="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-[10px] font-black uppercase transition-all">Ver Ejemplo 01</a>
                                    <a href="https://www.instagram.com/p/DUWJDP5jv0e/" target="_blank" className="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-[10px] font-black uppercase transition-all">Ver Ejemplo 02</a>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer Global */}
                    <div className="mt-32 py-12 border-t border-slate-800 flex flex-col md:flex-row justify-between items-center gap-8 text-[11px] font-bold text-slate-500 uppercase tracking-[0.4em]">
                        <span>Level Colombia x Wplay Digital Ecosystem</span>
                        <span className="text-amber-500 font-black">Mundial 2026 Strategy</span>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
