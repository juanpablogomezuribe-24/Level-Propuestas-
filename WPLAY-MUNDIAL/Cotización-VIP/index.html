<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización VIP Wplay - Mundial 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #080c14; color: #f1f5f9; }
        .custom-range { -webkit-appearance: none; width: 100%; height: 4px; background: #1e293b; border-radius: 5px; outline: none; }
        .custom-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; background: #f59e0b; cursor: pointer; border-radius: 50%; border: 2px solid #080c14; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- ICONOS SVG MANUALES PARA EVITAR ERRORES ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                users: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
                plane: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path></svg>,
                hotel: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,

                ticket: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg>,
                car: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="10" width="22" height="8" rx="2"></rect><path d="M7 10l3-6h4l3 6"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>,
                mapPin: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>,
                trophy: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>,
                alert: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            };
            return <span className={`flex items-center justify-center ${className}`}>{icons[name] || icons.alert}</span>;
        };

        const App = () => {
            const [numUsers, setNumUsers] = useState(8);
            const [scenario, setScenario] = useState('cdmx');
            const [activeDay, setActiveDay] = useState(1);

            const scenariosData = {
                cdmx: {
                    name: "Ciudad de México",
                    hotel: "Hotel Royal Pedregal PF",
                    stadium: "Estadio Azteca",
                    days: [
                        {
                            id: 1, title: "Día 1: Viaje y Desembarco", subtitle: "Llegada VIP a la capital mexicana",
                            activities: [
                                { name: "Vuelo Ida BOG-CDMX", cost: 28240000, type: "plane", detail: "Avianca | Directo 2:15 PM" },
                                { name: "Transporte Privado", cost: 435000, type: "car", detail: "Van ejecutiva Aeropuerto-Hotel" },
                                { name: "Hospedaje (4 Noches)", cost: 52830000, type: "hotel", detail: "8 habitaciones individuales" },
                                { name: "Transporte Cena (Ida/Vuelta)", cost: 367000, type: "car", detail: "Traslado Restaurante Rocasal" },
                                { name: "Cena Restaurante Rocasal", cost: 2400000, type: "utensils", detail: "Gastronomía exclusiva" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Caja menor día 1" }
                            ]
                        },
                        {
                            id: 2, title: "Día 2: Cultura y Gastronomía", subtitle: "Tour Paseo de la Reforma",
                            activities: [
                                { name: "Desayuno Buffet Hotel", cost: 640000, type: "utensils", detail: "Servicio premium hotel" },
                                { name: "Transporte Reforma (Ida/Vuelta)", cost: 876000, type: "car", detail: "Disponibilidad privada" },
                                { name: "Almuerzo El Bajío", cost: 3200000, type: "utensils", detail: "Reforma (Calificación 4.4)" },
                                { name: "Cena Zona Pedregal", cost: 1300000, type: "utensils", detail: "Restaurante Niza" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Caja menor día 2" }
                            ]
                        },
                        {
                            id: 3, title: "Día 3: Match Day", subtitle: "Colombia vs Uzbekistán",
                            note: "El partido es a las 10 PM. Se recomienda estancia en hotel previa al traslado por seguridad.",
                            activities: [
                                { name: "Desayuno Buffet Hotel", cost: 640000, type: "utensils", detail: "Energía para el partido" },
                                { name: "Snacks y Bebidas VIP Hotel", cost: 1500000, type: "utensils", detail: "Previa cómoda en el hotel" },
                                { name: "Almuerzo Especial Hotel", cost: 1940000, type: "utensils", detail: "Menú ejecutivo premium" },
                                { name: "Uber Black al Estadio", cost: 330000, type: "car", detail: "Traslado premium al Azteca" },
                                { name: "Boletas FIFA Cat 2", cost: 27840000, type: "ticket", detail: "Reventa oficial garantizada" },
                                { name: "Catering Estadio + Alrededores", cost: 6300000, type: "utensils", detail: "Consumo total día partido" },
                                { name: "Transporte Regreso", cost: 440000, type: "car", detail: "Traslado nocturno seguro" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Caja menor día 3" }
                            ]
                        },
                        {
                            id: 4, title: "Día 4: Regreso", subtitle: "Cierre de experiencia VIP",
                            activities: [
                                { name: "Desayuno Buffet Final", cost: 640000, type: "utensils", detail: "Check-out hotel" },
                                { name: "Transporte Aeropuerto", cost: 560000, type: "car", detail: "Van grupo completo" },
                                { name: "Vuelo Vuelta CDMX-BOG", cost: 27300000, type: "plane", detail: "Avianca | 2:00 PM - 7:00 PM" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Cierre de presupuesto" }
                            ]
                        }
                    ]
                },
                gdl: {
                    name: "Guadalajara",
                    hotel: "Hotel Guadalajara Plaza Expo",
                    stadium: "Estadio Akron",
                    days: [
                        {
                            id: 1, title: "Día 1: Viaje y Jalisco", subtitle: "Llegada VIP a Guadalajara",
                            activities: [
                                { name: "Vuelo Ida BOG-GDL", cost: 21440000, type: "plane", detail: "Copa | Escala PTY | Con equipaje" },
                                { name: "Transporte Aeropuerto GDL", cost: 980000, type: "car", detail: "Van ejecutiva privada" },
                                { name: "Hospedaje (4 Noches)", cost: 48970000, type: "hotel", detail: "8 habitaciones individuales" },
                                { name: "Almuerzo en el Hotel", cost: 2800000, type: "utensils", detail: "Bienvenida" },
                                { name: "Transporte Cena (Ida/Vuelta)", cost: 420000, type: "car", detail: "Traslado a Av. México" },
                                { name: "Cena Rest. Barbarella", cost: 3000000, type: "utensils", detail: "Gastronomía premium" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Caja menor día 1" }
                            ]
                        },
                        {
                            id: 2, title: "Día 2: Shopping & Relax", subtitle: "Visita Midtown Jalisco",
                            activities: [
                                { name: "Transporte Privado Van", cost: 563000, type: "car", detail: "Disponibilidad Midtown" },
                                { name: "Almuerzo Midtown Jalisco", cost: 2700000, type: "utensils", detail: "Zona gourmet exclusiva" },
                                { name: "Cena en el Hotel", cost: 1860000, type: "utensils", detail: "Cena relax previa" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Caja menor día 2" }
                            ]
                        },
                        {
                            id: 3, title: "Día 3: Match Day GDL", subtitle: "Colombia vs Jamaica / Rep.",
                            activities: [
                                { name: "Almuerzo Flor de Calabaza", cost: 1600000, type: "utensils", detail: "Comida Mexicana (Lado hotel)" },
                                { name: "Coffee Break Starbucks", cost: 336000, type: "utensils", detail: "Break VIP media tarde" },
                                { name: "Uber Black al Akron", cost: 350000, type: "car", detail: "Traslado premium" },
                                { name: "Boletas FIFA Cat 2", cost: 25022000, type: "ticket", detail: "Reventa oficial Akron" },
                                { name: "VIP Catering + Cena Post", cost: 5500000, type: "utensils", detail: "Consumo día partido" },
                                { name: "Transporte Regreso Seguro", cost: 510000, type: "car", detail: "Traslado nocturno" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Caja menor día 3" }
                            ]
                        },
                        {
                            id: 4, title: "Día 4: Regreso", subtitle: "Cierre de estancia en Jalisco",
                            activities: [
                                { name: "Almuerzo Final Hotel", cost: 2200000, type: "utensils", detail: "Antes de salida" },
                                { name: "Transporte Aeropuerto", cost: 1100000, type: "car", detail: "Van grupo completo" },
                                { name: "Vuelo Vuelta GDL-BOG", cost: 28408000, type: "plane", detail: "VivaAerobus | Parada CDMX" },
                                { name: "Fondo de Imprevistos", cost: 1000000, type: "alert", detail: "Cierre presupuesto" }
                            ]
                        }
                    ]
                }
            };

            const current = scenariosData[scenario];
            const factor = numUsers / 8;

            const calculateDayTotal = (day) => {
                return day.activities.reduce((sum, act) => sum + (act.cost * factor), 0);
            };

            const grandTotal = useMemo(() => {
                return current.days.reduce((sum, day) => sum + calculateDayTotal(day), 0);
            }, [numUsers, scenario]);

            const formatCurrency = (val) => new Intl.NumberFormat('es-CO', {
                style: 'currency', currency: 'COP', maximumFractionDigits: 0
            }).format(val);

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto selection:bg-amber-500 selection:text-black">
                    {/* Header */}
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8 mb-12">
                        <div className="border-l-4 border-amber-500 pl-8">
                            <h4 className="text-amber-500 font-black tracking-[0.4em] uppercase text-[10px] mb-2 leading-none">Wplay.co Premium Services</h4>
                            <h1 className="text-5xl font-black italic tracking-tighter text-white uppercase leading-none">Cotización VIP Mundial</h1>
                        </div>

                        <div className="flex flex-wrap gap-4 bg-slate-900/50 p-2 rounded-[2rem] border border-slate-800 backdrop-blur-xl">
                            <button onClick={() => {setScenario('cdmx'); setActiveDay(1)}} className={`px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all ${scenario === 'cdmx' ? 'bg-amber-500 text-slate-900 shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:text-white'}`}>México</button>
                            <button onClick={() => {setScenario('gdl'); setActiveDay(1)}} className={`px-8 py-3 rounded-2xl text-xs font-black uppercase transition-all ${scenario === 'gdl' ? 'bg-amber-500 text-slate-900 shadow-lg shadow-amber-500/20' : 'text-slate-400 hover:text-white'}`}>Guadalajara</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Sidebar */}
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-slate-900 rounded-[2.5rem] p-8 border border-slate-800 shadow-2xl">
                                <h3 className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-6 flex items-center gap-2">
                                    <Icon name="users" className="text-amber-500 w-4 h-4" /> Invitados VIP
                                </h3>
                                <div className="flex items-center gap-6 mb-4">
                                    <input type="range" min="1" max="24" value={numUsers} onChange={(e) => setNumUsers(parseInt(e.target.value))} className="custom-range flex-1" />
                                    <span className="text-5xl font-black text-white italic leading-none">{numUsers}</span>
                                </div>
                                <p className="text-[9px] text-slate-500 uppercase font-bold tracking-widest text-center">Ajuste de presupuesto dinámico</p>
                            </div>

                            <div className="bg-gradient-to-br from-amber-500 to-amber-600 rounded-[2.5rem] p-10 shadow-2xl border border-amber-400/30">
                                <p className="text-slate-900 font-black uppercase text-[11px] tracking-[0.2em] mb-2 text-center md:text-left">Total Presupuestado</p>
                                <h2 className="text-4xl md:text-5xl font-black text-slate-900 italic tracking-tighter mb-6 leading-none text-center md:text-left">{formatCurrency(grandTotal)}</h2>
                                <div className="bg-slate-950/15 p-5 rounded-2xl border border-black/5 flex justify-between items-center text-[12px] font-black text-slate-900 uppercase">
                                    <span className="opacity-70 text-[10px]">Costo x Persona:</span>
                                    <span>{formatCurrency(grandTotal / numUsers)}</span>
                                </div>
                            </div>

                            <div className="bg-slate-900/50 rounded-[2.5rem] p-8 border border-slate-800">
                                <div className="flex items-center gap-4 mb-8">
                                    <Icon name="mapPin" className="text-amber-500 w-8 h-8" />
                                    <div>
                                        <p className="text-[9px] text-slate-500 uppercase font-black tracking-widest leading-none mb-1">Sede Mundial</p>
                                        <p className="text-2xl font-black text-white uppercase italic leading-none">{current.name}</p>
                                    </div>
                                </div>
                                <div className="space-y-4 text-white">
                                    <div className="flex items-start gap-3">
                                        <Icon name="hotel" className="text-slate-600 w-4 h-4 mt-1" />
                                        <div><p className="text-[9px] font-black text-slate-500 uppercase leading-none mb-1">Hotel VIP</p><p className="text-xs font-bold">{current.hotel}</p></div>
                                    </div>
                                    <div className="flex items-start gap-3">
                                        <Icon name="trophy" className="text-slate-600 w-4 h-4 mt-1" />
                                        <div><p className="text-[9px] font-black text-slate-500 uppercase leading-none mb-1">Estadio Sede</p><p className="text-xs font-bold">{current.stadium}</p></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Itinerario Principal */}
                        <div className="lg:col-span-8 space-y-6">
                            <div className="grid grid-cols-4 bg-slate-900/80 p-2 rounded-[2rem] border border-slate-800 gap-2">
                                {current.days.map((day) => (
                                    <button key={day.id} onClick={() => setActiveDay(day.id)} className={`py-4 px-2 rounded-2xl transition-all flex flex-col items-center gap-1 ${activeDay === day.id ? 'bg-slate-800 border border-amber-500/50 shadow-xl' : 'hover:bg-slate-800/40'}`}>
                                        <span className={`text-[10px] font-black uppercase tracking-widest ${activeDay === day.id ? 'text-amber-500' : 'text-slate-500'}`}>Día 0{day.id}</span>
                                        <span className={`text-[10px] font-bold uppercase text-center ${activeDay === day.id ? 'text-white' : 'text-slate-500'}`}>
                                            {day.id === 1 ? 'Viaje' : day.id === 2 ? 'Relax' : day.id === 3 ? 'Match' : 'Regreso'}
                                        </span>
                                    </button>
                                ))}
                            </div>

                            <div className="bg-slate-900 rounded-[3rem] border border-slate-800 shadow-2xl overflow-hidden min-h-[600px] flex flex-col">
                                <div className="bg-gradient-to-r from-slate-800/80 to-transparent p-10 border-b border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                                    <div>
                                        <span className="text-amber-500 font-black text-[10px] uppercase tracking-[0.4em] mb-2 block text-white/50">Planificación VIP</span>
                                        <h2 className="text-3xl md:text-4xl font-black text-white italic uppercase tracking-tighter leading-none mb-2">{current.days[activeDay-1].title}</h2>
                                        <p className="text-slate-400 text-xs italic opacity-70">{current.days[activeDay-1].subtitle}</p>
                                    </div>
                                    <div className="bg-slate-950 px-5 py-2 rounded-full border border-slate-700 shadow-inner">
                                        <span className="text-[12px] font-black text-white uppercase italic tracking-tighter">Total Día: {formatCurrency(calculateDayTotal(current.days[activeDay-1]))}</span>
                                    </div>
                                </div>

                                <div className="p-8 space-y-3 flex-grow overflow-y-auto no-scrollbar">
                                    {current.days[activeDay-1].activities.map((act, idx) => (
                                        <div key={idx} className="flex flex-col md:flex-row justify-between items-start md:items-center p-5 rounded-3xl bg-slate-950/40 border border-slate-800/50 hover:border-amber-500/30 transition-all group">

                                                <div className="h-12 w-12 rounded-2xl bg-slate-900 flex items-center justify-center border border-slate-800 group-hover:scale-105 transition-transform">
                                                    <Icon name={act.type} className="text-amber-500" />
                                                </div>
                                                <div>
                                                    <h4 className="text-sm font-black text-slate-100 uppercase tracking-tight leading-none mb-1">{act.name}</h4>
                                                    <p className="text-[10px] text-slate-500 font-bold uppercase leading-tight">{act.detail}</p>
                                                </div>
                                            </div>
                                            <div className="text-right w-full md:w-auto pt-3 md:pt-0 border-t md:border-0 border-slate-800/50">
                                                <p className="text-[10px] text-slate-500 font-black uppercase mb-0.5 tracking-widest">Inversión Estimada</p>
                                                <p className="text-lg font-black text-amber-500 italic leading-none">{formatCurrency(act.cost * factor)}</p>
                                            </div>
                                        </div>
                                    ))}

                                    {current.days[activeDay-1].note && (
                                        <div className="mt-8 bg-red-500/5 border border-red-500/20 p-6 rounded-3xl flex gap-4 items-start shadow-xl">
                                            <Icon name="alert" className="text-red-500 w-5 h-5 shrink-0" />
                                            <p className="text-[11px] text-red-200/60 italic leading-relaxed">
                                                <span className="font-black text-red-500 uppercase not-italic block mb-1 tracking-widest">Recomendación Estratégica:</span>
                                                "{current.days[activeDay-1].note}"
                                            </p>
                                        </div>
                                    )}
                                </div>

                                <div className="p-8 bg-slate-950/50 border-t border-slate-800 flex justify-between items-center text-[9px] font-bold text-slate-600 uppercase tracking-widest">
                                    <div className="flex gap-4">
                                        <span>Proyección TRM Diaria</span>
                                        <span>Garantía Wplay VIP</span>
                                    </div>
                                    <span className="text-amber-500 font-black">Level Colombia x Wplay</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
