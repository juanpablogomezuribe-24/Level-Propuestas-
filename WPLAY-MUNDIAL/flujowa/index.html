<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wplay 2026 - Jorge Barón Flow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* WhatsApp Background */
        .chat-bg {
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            background-size: 400px;
            background-blend-mode: soft-light;
            background-color: #0b141a;
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slideUp {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-bounce-dot {
            animation: bounce 0.6s infinite;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen font-sans">

    <!-- Phone Frame -->
    <div class="w-full max-w-md h-[850px] bg-[#0b141a] flex flex-col relative shadow-2xl overflow-hidden border-x border-gray-800">
        
        <!-- Header -->
        <div class="bg-[#202c33] px-4 py-2 flex items-center justify-between z-10 shadow-md cursor-pointer">
            <div class="flex items-center space-x-3">
                <i data-lucide="arrow-left" class="text-gray-300 w-5 h-5"></i>
                <div class="relative">
                    <img src="https://pbs.twimg.com/profile_images/1542618968395563010/8yK3bJ3n_400x400.jpg" alt="Profile" class="w-10 h-10 rounded-full object-cover border border-gray-600">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-[#202c33]"></div>
                </div>
                <div class="flex flex-col">
                    <span class="text-white font-medium text-base flex items-center">
                        Jorge Barón 🇨🇴 <i data-lucide="check-check" class="w-3 h-3 text-[#53bdeb] ml-1"></i>
                    </span>
                    <span class="text-gray-400 text-xs">En línea</span>
                </div>
            </div>
            <div class="flex space-x-4 text-[#00a884]">
                <i data-lucide="video" class="w-5 h-5"></i>
                <i data-lucide="phone" class="w-5 h-5"></i>
                <i data-lucide="more-vertical" class="w-5 h-5 text-gray-400"></i>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 custom-scrollbar chat-bg flex flex-col space-y-2 relative">
            <!-- Encryption Notice -->
            <div class="flex justify-center mb-6">
                <div class="bg-[#182229] text-[#8696a0] text-[10px] px-3 py-1.5 rounded-lg text-center shadow-sm max-w-[80%] flex items-center gap-1">
                    <i data-lucide="lock" class="w-3 h-3"></i> Los mensajes y las llamadas están cifrados de extremo a extremo.
                </div>
            </div>

            <!-- Messages will be injected here -->
            <div id="messages-list" class="flex flex-col space-y-2 pb-2"></div>
            
            <!-- Typing Indicator (Hidden by default) -->
            <div id="typing-indicator" class="hidden justify-start mb-2">
                <div class="bg-[#202c33] p-3 rounded-lg rounded-tl-none flex space-x-1 items-center h-10 w-16">
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce-dot"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce-dot delay-100"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce-dot delay-200"></div>
                </div>
            </div>
        </div>

        <!-- Interactive Area (Bottom) -->
        <div class="bg-[#111b21] border-t border-[#202c33] relative">
            <!-- Options Container -->
            <div id="options-container" class="p-2 flex flex-col space-y-2 absolute bottom-full left-0 w-full bg-gradient-to-t from-[#0b141a] to-transparent pb-4 hidden">
                <!-- Buttons injected here -->
            </div>

            <!-- Input Bar -->
            <div class="p-2 flex items-center space-x-2 z-20 bg-[#111b21]">
                <div class="p-2 text-gray-400 hover:bg-[#2a3942] rounded-full transition-colors cursor-pointer">
                    <i data-lucide="smile" class="w-6 h-6"></i>
                </div>
                <div class="p-2 text-gray-400 hover:bg-[#2a3942] rounded-full transition-colors cursor-pointer">
                    <i data-lucide="paperclip" class="w-5 h-5"></i>
                </div>
                <div id="input-placeholder" class="flex-1 bg-[#2a3942] rounded-lg h-10 px-4 flex items-center text-gray-400 text-sm select-none">
                   Escribe un mensaje
                </div>
                <div id="mic-btn" class="p-2 bg-[#00a884] text-white rounded-full cursor-pointer">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </div>
            </div>
        </div>

    </div>

    <!-- Logic -->
    <script>
        // --- Data ---
        const FLOW_DATA = {
            intro: {
                video: {
                    thumbnail: "bg-slate-800",
                    duration: "0:15",
                    description: "VIDEO: Jorge serio con balón antiguo. Iluminación dramática.",
                    icon: "⚽"
                },
                text: "Yo no prometo suerte… pero cuando la he dado, ha funcionado. La pregunta es: ¿me crees? 🤨\n\nYa le di la patadita a David… pero para que Colombia gane, la buena suerte tiene que estar en TODO el país. 🇨🇴\n\n*¿Quieres recibir la patadita de la suerte?*"
            },
            options_intro: [
                { id: 'yes', label: '¡Sí, dámela Jorge! 🦶✨' },
                { id: 'ready', label: '¡Estoy listo! 🇨🇴' }
            ],
            choice_prompt: "¡Esa es la actitud! 🤩 Pero ojo... la suerte no llega sola, hay que invocarla con historia.\n\nPara activar tu patadita, escoge el *Amuleto de Leyenda* que usaremos hoy: 👇",
            options_ritual: [
                { id: 'yellow', label: '🟡 Los Calzoncillos del 10 🩲' },
                { id: 'blue', label: '🔵 El Jabón Rey pal\' Mono 🧼' },
                { id: 'red', label: '🔴 El Tinte Rojo del Loco 💈' }
            ],
            results: {
                yellow: {
                    video: {
                        thumbnail: "bg-yellow-600",
                        duration: "0:12",
                        description: "VIDEO: Jorge saca unos boxers gigantes amarillos. Lanza la patada.",
                        icon: "🩲"
                    },
                    text: "¡Sabía que elegirías la magia! ✨ Los calzoncillos amarillos siempre van para el que pone el talento. Ponte la 10 tú también... ¡Eeeeeentusiasmo y a cobrar! 🦶💨"
                },
                blue: {
                    video: {
                        thumbnail: "bg-blue-600",
                        duration: "0:14",
                        description: "VIDEO: Jorge con peluca rubia inmensa lavándola con Jabón Rey.",
                        icon: "🦁"
                    },
                    text: "¡Excelente! Al gran capitán hay que tenerlo limpiecito. 🦁 Lavando la melena sacamos la sal... ¡Todo Bien, Todo Bien! 👍 ¡Patadita purificada para ti!"
                },
                red: {
                    video: {
                        thumbnail: "bg-red-600",
                        duration: "0:10",
                        description: "VIDEO: Jorge con peluca negra larga y brocha de tinte rojo.",
                        icon: "🦂"
                    },
                    text: "¡Uff, te fuiste por el riesgo! 🦂 A este loco ya le cortamos el pelo... ¡ahora le toca pintárselo de ROJO PASIÓN! El que no arriesga no gana. ¡Locura total! 🤪"
                }
            },
            final: {
                text: "✅ *¡RITUAL COMPLETADO CON ÉXITO!*\n\nLa energía de la Selección y mi patadita ya están contigo. 🙏⚽\n\n🎁 *Tu Bono de la Buena Suerte:*\n`WPLAY-MUNDIAL-2026`",
                cta: "🤑 RECLAMAR MI BONO AHORA"
            }
        };

        // --- DOM Elements ---
        const messagesList = document.getElementById('messages-list');
        const chatContainer = document.getElementById('chat-container');
        const typingIndicator = document.getElementById('typing-indicator');
        const optionsContainer = document.getElementById('options-container');
        const inputPlaceholder = document.getElementById('input-placeholder');
        const micBtn = document.getElementById('mic-btn');

        // --- Helpers ---
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            typingIndicator.classList.remove('hidden');
            typingIndicator.classList.add('flex');
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.classList.add('hidden');
            typingIndicator.classList.remove('flex');
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function createMessageHTML(type, content, sender) {
            const isUser = sender === 'user';
            const alignClass = isUser ? 'justify-end' : 'justify-start';
            const bgClass = isUser ? 'bg-[#005c4b] text-white rounded-tr-none' : 'bg-[#202c33] text-white rounded-tl-none';
            const checkIcon = isUser ? `<i data-lucide="check-check" class="w-3 h-3 text-[#53bdeb]"></i>` : '';

            let innerContent = '';

            if (type === 'video') {
                innerContent = `
                    <div class="mb-2 rounded-lg overflow-hidden relative cursor-pointer group">
                        <div class="w-full h-48 ${content.thumbnail} flex flex-col items-center justify-center text-center p-4 relative">
                            <div class="absolute inset-0 bg-black bg-opacity-30"></div>
                            <div class="z-10 bg-black bg-opacity-60 rounded-full p-3 mb-2 transform transition-transform group-hover:scale-110">
                                <i data-lucide="play" class="w-6 h-6 text-white ml-1"></i>
                            </div>
                            <span class="z-10 text-4xl mb-2">${content.icon}</span>
                            <p class="z-10 text-xs text-white font-medium opacity-90 px-2">${content.description}</p>
                            <span class="absolute bottom-2 left-2 bg-black bg-opacity-70 text-white text-xs px-1 rounded">
                                ${content.duration}
                            </span>
                        </div>
                    </div>
                `;
            }

            if (type === 'text' || type === 'video') {
                // Parse bold text ** or *
                let text = type === 'video' ? "" : content;
                // Simple markdown parser for bold
                text = text.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
                
                // Check for coupon code
                const couponMatch = text.match(/`([^`]+)`/);
                let couponHTML = '';
                if (couponMatch) {
                    text = text.replace(couponMatch[0], '');
                    couponHTML = `
                        <div class="bg-slate-700 bg-opacity-30 p-2 rounded border border-dashed border-slate-500 mt-2 font-mono text-center text-yellow-400 font-bold tracking-wider select-all cursor-pointer hover:bg-opacity-50 transition">
                            ${couponMatch[1]}
                        </div>
                    `;
                }

                innerContent += `
                    <div class="text-sm leading-relaxed whitespace-pre-wrap">${text}</div>
                    ${type === 'video' ? '<span class="text-[10px] opacity-60 uppercase block mt-1">Video • ' + content.duration + '</span>' : ''}
                    ${couponHTML}
                `;
            }

            if (type === 'cta') {
                innerContent = `
                    <div class="mt-1">
                        <button class="w-full bg-[#00a884] hover:bg-[#008f6f] text-white font-bold py-2 px-4 rounded shadow text-sm transition-colors uppercase tracking-wide">
                            ${content}
                        </button>
                    </div>
                `;
            }

            return `
                <div class="flex ${alignClass} mb-2 animate-slideUp">
                    <div class="max-w-[85%] rounded-lg p-2 relative shadow-sm ${bgClass}">
                        ${innerContent}
                        <div class="flex justify-end items-center space-x-1 mt-1">
                            <span class="text-[10px] text-gray-400">${getCurrentTime()}</span>
                            ${checkIcon}
                        </div>
                    </div>
                </div>
            `;
        }

        function appendMessage(type, content, sender) {
            const msgHTML = createMessageHTML(type, content, sender);
            messagesList.insertAdjacentHTML('beforeend', msgHTML);
            lucide.createIcons(); // Re-init icons for new content
            scrollToBottom();
        }

        function renderOptions(options, type) {
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-[#202c33] hover:bg-[#2a3942] text-[#00a884] font-medium py-3 px-4 rounded-xl text-center shadow-sm transition-colors border border-[#2a3942] w-full mb-2";
                btn.innerText = opt.label;
                btn.onclick = () => handleOptionSelect(opt, type);
                optionsContainer.appendChild(btn);
            });
            optionsContainer.classList.remove('hidden');
            inputPlaceholder.innerText = "Elige una opción...";
            
            // Change mic icon to send icon just for visual logic, though we don't use it
            micBtn.innerHTML = '<i data-lucide="mic" class="w-5 h-5"></i>';
            lucide.createIcons();
            scrollToBottom();
        }

        // --- Logic Flow ---

        async function startFlow() {
            // 1. Wait
            showTyping();
            await new Promise(r => setTimeout(r, 1500));
            
            // 2. Video Intro
            hideTyping();
            appendMessage('video', FLOW_DATA.intro.video, 'bot');
            
            // 3. Wait
            showTyping();
            await new Promise(r => setTimeout(r, 2000));
            
            // 4. Text Intro
            hideTyping();
            appendMessage('text', FLOW_DATA.intro.text, 'bot');
            
            // 5. Options
            renderOptions(FLOW_DATA.options_intro, 'intro');
        }

        async function handleOptionSelect(option, type) {
            // Hide options
            optionsContainer.classList.add('hidden');
            inputPlaceholder.innerText = "Escribe un mensaje";

            // User Message
            appendMessage('text', option.label, 'user');

            if (type === 'intro') {
                showTyping();
                await new Promise(r => setTimeout(r, 1500));
                
                hideTyping();
                appendMessage('text', FLOW_DATA.choice_prompt, 'bot');
                
                renderOptions(FLOW_DATA.options_ritual, 'ritual');
            }
            else if (type === 'ritual') {
                const resultData = FLOW_DATA.results[option.id];
                
                // 1. Result Video
                showTyping();
                await new Promise(r => setTimeout(r, 2000));
                hideTyping();
                appendMessage('video', resultData.video, 'bot');

                // 2. Result Text
                showTyping();
                await new Promise(r => setTimeout(r, 1500));
                hideTyping();
                appendMessage('text', resultData.text, 'bot');

                // 3. Final Code
                showTyping();
                await new Promise(r => setTimeout(r, 1000));
                hideTyping();
                appendMessage('text', FLOW_DATA.final.text, 'bot');

                // 4. CTA
                appendMessage('cta', FLOW_DATA.final.cta, 'bot');
            }
        }

        // --- Init ---
        lucide.createIcons();
        startFlow();

    </script>
</body>
</html>
