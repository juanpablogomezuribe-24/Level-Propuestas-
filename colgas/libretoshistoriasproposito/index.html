        function copyToClipboard(button, textArray) {
            const text = textArray.join('\n\n');
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const originalContent = button.innerHTML;
                button.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Copiado`;
                button.classList.add('bg-green-500/20', 'text-green-500');
                lucide.createIcons();
                setTimeout(() => {
                    button.innerHTML = originalContent;
                    button.classList.remove('bg-green-500/20', 'text-green-500');
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('Error al copiar', err);
            }
            document.body.removeChild(textArea);
        }

                                    </div>
                                </div>
                                <a href="${video.videoLink}" target="_blank" class="group/btn w-full sm:w-auto flex items-center justify-center gap-3 px-8 py-4 bg-white text-slate-950 hover:bg-yellow-500 transition-all rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl transform active:scale-95">
                                    Reproducir Material <i data-lucide="external-link" class="w-4 h-4 transition-transform group-hover/btn:translate-x-1 group-hover/btn:-translate-y-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(section);
            });

            lucide.createIcons();
            observeReveals();
        }

        // Observer para animaciones de entrada
        function observeReveals() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        // Barra de progreso y búsqueda
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById("progress-bar").style.width = scrolled + "%";
        });

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderVideos(e.target.value);
        });

        // Inicio
        window.onload = () => {
            renderVideos();
        };
    </script>
</body>
</html>
