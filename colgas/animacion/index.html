<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Energía Mundialista - Cilindro Centrado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        /* Emulación de Neo Sans Pro */
        @font-face {
            font-family: 'Neo Sans Pro';
            src: local('Neo Sans Pro'), local('Neo Sans'), sans-serif;
        }

        :root {
            --colgas-blue: #00a8e1;
            --colgas-orange: #e85d24;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Neo Sans Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #app-container {
            width: 1920px; height: 1080px;
            position: relative;
            background-image: url('https://i.postimg.cc/kgMLNRyH/FONDO-COLGAS-1920-1080-(1).png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: top left;
        }

        /* Contenedor del Cilindro Centrado */
        .cylinder-container {
            position: absolute;
            top: 45%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 580px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .pipette-base {
            position: absolute;
            height: 100%; width: auto;
            filter: grayscale(1) brightness(0.6) opacity(0.4);
            z-index: 1;
        }

        .pipette-fill {
            position: absolute;
            height: 100%; width: auto;
            z-index: 2;
            clip-path: inset(100% 0 0 0); 
            filter: drop-shadow(0 0 30px var(--colgas-blue));
        }

        .pipette-glow {
            position: absolute;
            height: 100%; width: auto;
            z-index: 3;
            opacity: 0;
            filter: brightness(3) blur(4px);
        }

        /* Contenedor de Texto Centrado Abajo con Perspectiva de Cancha */
        .field-text-wrapper {
            position: absolute;
            bottom: 5%; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px; 
            z-index: 10;
        }

        .value-text {
            color: white;
            font-size: 150px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-align: center;
            opacity: 0;
            /* Perspectiva para estar pegada a la cancha como en la referencia */
            transform: rotateX(60deg) scaleY(1.6);
            transform-origin: bottom center;
            /* Efecto pintura sobre césped */
            filter: drop-shadow(0 0 15px rgba(0, 168, 225, 0.5));
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0.4));
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Botón de descarga oculto para grabación, visible al pasar el mouse */
        #downloadBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--colgas-orange);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            font-weight: bold;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        #downloadBtn:hover { opacity: 1; }
    </style>
</head>
<body>

<div id="app-container">
    <div class="cylinder-container" id="cylinderBox">
        <img src="https://i.postimg.cc/6q9hsnT7/Cilindro-final-colgas.png" class="pipette-base">
        <img src="https://i.postimg.cc/6q9hsnT7/Cilindro-final-colgas.png" class="pipette-fill" id="pipetteFill">
        <img src="https://i.postimg.cc/6q9hsnT7/Cilindro-final-colgas.png" class="pipette-glow" id="pipetteGlow">
    </div>

    <div class="field-text-wrapper">
        <div id="valueDisplay" class="value-text">SACRIFICIO</div>
    </div>

    <canvas id="gasCanvas"></canvas>
</div>

<button id="downloadBtn" onclick="downloadThis()">Descargar HTML</button>

<script>
    function scaleApp() {
        const app = document.getElementById('app-container');
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        app.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleApp);
    scaleApp();

    const pipetteFill = document.getElementById('pipetteFill');
    const pipetteGlow = document.getElementById('pipetteGlow');
    const valueDisplay = document.getElementById('valueDisplay');
    const cylinderBox = document.getElementById('cylinderBox');
    const canvas = document.getElementById('gasCanvas');
    const ctx = canvas.getContext('2d');

    const steps = [
        { label: "SACRIFICIO", fill: 83.3 },
        { label: "ESFUERZO", fill: 66.6 },
        { label: "RESILIENCIA", fill: 50.0 },
        { label: "DISCIPLINA", fill: 33.3 },
        { label: "PERSEVERANCIA", fill: 16.6 },
        { label: "LEGADO", fill: 0 }
    ];

    let particles = [];
    let animationPhase = 0; 

    function resizeCanvas() {
        canvas.width = 1920; canvas.height = 1080;
    }
    resizeCanvas();

    class GasParticle {
        constructor(x, y, tx, ty) {
            this.x = x || Math.random() * canvas.width;
            this.y = y || Math.random() * canvas.height;
            this.tx = tx; this.ty = ty;
            this.vx = (Math.random() - 0.5) * 60;
            this.vy = (Math.random() - 0.5) * 60;
            this.friction = 0.92;
            this.size = Math.random() * 9 + 2;
        }
        update() {
            let dx = this.tx - this.x; let dy = this.ty - this.y;
            this.vx = (this.vx + dx * 0.08) * this.friction;
            this.vy = (this.vy + dy * 0.08) * this.friction;
            this.x += this.vx; this.y += this.vy;
        }
        draw() {
            ctx.fillStyle = `rgba(0, 168, 225, ${0.7 + Math.random()*0.3})`;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
        }
    }

    function initFinalAnimation() {
        particles = [];
        ctx.font = "bold 380px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.clearRect(0,0, canvas.width, canvas.height);
        ctx.fillText("COLGAS", canvas.width/2, canvas.height/2);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        for (let y = 0; y < canvas.height; y += 5) {
            for (let x = 0; x < canvas.width; x += 5) {
                if (data[(y * canvas.width + x) * 4 + 3] > 128) {
                    particles.push(new GasParticle(null, null, x, y));
                }
            }
        }
    }

    const tl = gsap.timeline();

    tl.from(cylinderBox, { scale: 0, rotationY: -90, duration: 1.5, ease: "back.out(1.4)" });

    steps.forEach((step, index) => {
        tl.to(pipetteFill, {
            clipPath: `inset(${step.fill}% 0 0 0)`,
            duration: 2.5,
            ease: "power2.out"
        });

        tl.to(valueDisplay, {
            opacity: 0.8,
            duration: 1,
            onStart: () => { 
                valueDisplay.innerText = step.label;
            }
        }, "-=2");

        tl.to({}, { duration: 7 });

        if (index < steps.length - 1) {
            tl.to([pipetteGlow, valueDisplay], {
                opacity: (i, t) => t === pipetteGlow ? 0.9 : 0.2,
                duration: 0.15,
                repeat: 19, 
                yoyo: true,
                ease: "none"
            });
            tl.to(valueDisplay, { opacity: 0, duration: 0.4 });
        }
    });

    tl.to({}, { duration: 6 });

    tl.to([cylinderBox, valueDisplay], { 
        opacity: 0, scale: 1.2, filter: "blur(40px)", duration: 0.8,
        onStart: () => {
            animationPhase = 1;
            initFinalAnimation();
            document.getElementById('downloadBtn').style.display = 'none'; // Ocultar botón al final
        }
    });

    function animate() {
        if (animationPhase === 1) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';
            particles.forEach(p => { p.update(); p.draw(); });
        }
        requestAnimationFrame(animate);
    }
    animate();

    // Función para descargar el archivo
    function downloadThis() {
        const html = document.documentElement.outerHTML;
        const blob = new Blob([html], {type: 'text/html'});
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'animacion_colgas_final.html';
        a.click();
        window.URL.revokeObjectURL(url);
    }

</script>
</body>
</html>
