<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Energía Mundialista - Resiliencia Final</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @font-face {
            font-family: 'Neo Sans Pro';
            src: local('Neo Sans Pro'), local('Neo Sans'), sans-serif;
        }

        :root {
            --colgas-blue: #00a8e1;
            --colgas-orange: #e85d24;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Neo Sans Pro', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #app-container {
            width: 1920px; height: 1080px;
            position: relative;
            background-image: url('https://i.postimg.cc/8PHTV6Pk/corregido.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: top left;
        }

        #controls-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 2000;
            gap: 30px;
            transition: opacity 0.8s ease;
        }

        .btn {
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, background 0.3s;
        }

        #play-btn {
            background-color: var(--colgas-blue);
            color: white;
            box-shadow: 0 0 30px rgba(0, 168, 225, 0.5);
            display: flex; align-items: center; gap: 15px;
        }

        #play-btn:hover { background-color: #008fbf; transform: scale(1.05); }

        #download-btn {
            background-color: transparent;
            color: white;
            border: 2px solid white;
            font-size: 18px;
            opacity: 0.7;
        }

        #download-btn:hover { opacity: 1; transform: scale(1.05); }

        /* Contenedor del Cilindro - Posición baja */
        .cylinder-container {
            position: absolute;
            top: 60%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 580px;
            z-index: 20;
        }

        /* Imagen de base (fondo del cilindro) */
        .pipette-base {
            position: absolute;
            top: 0; left: 0;
            height: 100%; width: 100%;
            object-fit: contain;
            filter: grayscale(1) brightness(0.6) opacity(0.4);
            z-index: 1;
        }

        /* Máscara de llenado */
        .pipette-fill-mask {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 0%; 
            overflow: hidden;
            z-index: 2;
        }

        /* Imagen de llenado */
        .pipette-fill-img {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 580px; 
            object-fit: contain;
            filter: drop-shadow(0 0 30px var(--colgas-blue));
        }

        .field-text-wrapper {
            position: absolute;
            bottom: 3%; 
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px; 
            z-index: 10;
        }

        .value-text {
            color: white;
            font-size: 150px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-align: center;
            opacity: 0;
            transform: rotateX(60deg) scaleY(1.6);
            transform-origin: bottom center;
            text-shadow: 0 0 20px rgba(0, 168, 225, 0.4), 2px 2px 10px rgba(0,0,0,0.5);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0.4));
        }

        #final-logo-container {
            position: absolute;
            opacity: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #final-logo-img {
            max-width: 800px;
            filter: drop-shadow(0 0 30px rgba(0, 168, 225, 0.5));
        }
    </style>
</head>
<body>

<div id="controls-overlay">
    <h1 style="color: white; font-size: 40px; margin-bottom: 10px;">La Energía Mundialista</h1>
    <p style="color: #aaa; font-size: 18px; margin-bottom: 20px;">Versión: RESILIENCIA AL FINAL</p>
    <button id="play-btn" class="btn" onclick="startAnimation()">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        Iniciar Animación
    </button>
    <button id="download-btn" class="btn" onclick="downloadThis()">Descargar Archivo</button>
</div>

<div id="app-container">
    <div id="final-logo-container">
        <img id="final-logo-img" src="https://i.postimg.cc/Qx9xctXD/logo-colgas.webp" alt="Logo Colgas">
    </div>

    <div class="cylinder-container" id="cylinderBox">
        <img src="https://i.postimg.cc/LXxQ427G/cilindro-final.png" class="pipette-base">
        <div class="pipette-fill-mask" id="fillMask">
            <img src="https://i.postimg.cc/LXxQ427G/cilindro-final.png" class="pipette-fill-img">
        </div>
    </div>

    <div class="field-text-wrapper">
        <div id="valueDisplay" class="value-text">SACRIFICIO</div>
    </div>
</div>

<script>
    function scaleApp() {
        const app = document.getElementById('app-container');
        const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        app.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleApp);
    scaleApp();

    const fillMask = document.getElementById('fillMask');
    const valueDisplay = document.getElementById('valueDisplay');
    const cylinderBox = document.getElementById('cylinderBox');
    const finalLogoContainer = document.getElementById('final-logo-container');

    // Secuencia con RESILIENCIA al final
    const steps = [
        "SACRIFICIO",
        "ESFUERZO",
        "DISCIPLINA",
        "LEGADO",
        "PERSEVERANCIA",
        "RESILIENCIA"
    ];

    const tl = gsap.timeline({ paused: true });

    tl.from(cylinderBox, { 
        scale: 0, 
        rotationY: -90, 
        duration: 1.5, 
        ease: "back.out(1.4)" 
    });

    tl.to(fillMask, {
        height: "100%",
        duration: 60,
        ease: "none"
    }, 1.5);

    steps.forEach((word, index) => {
        const startTime = 1.5 + (index * 10);

        tl.to(valueDisplay, {
            opacity: 1,
            duration: 7,
            ease: "power1.in",
            onStart: () => { 
                valueDisplay.innerText = word;
            }
        }, startTime);

        if (index < steps.length - 1) {
            tl.to(valueDisplay, {
                opacity: 0.2,
                duration: 0.15,
                repeat: 19, 
                yoyo: true,
                ease: "none"
            }, startTime + 7);

            tl.to(valueDisplay, { opacity: 0, duration: 0.1 }, startTime + 9.9);
        } else {
            tl.to({}, { duration: 3 }, startTime + 7);
        }
    });

    const endTime = 1.5 + (steps.length * 10);
    
    tl.to([cylinderBox, valueDisplay], { 
        opacity: 0, 
        duration: 1.2,
        ease: "power2.inOut"
    }, endTime);

    tl.to(finalLogoContainer, {
        opacity: 1,
        scale: 1.05,
        duration: 2,
        ease: "power2.out"
    }, endTime + 0.5);

    function startAnimation() {
        document.getElementById('controls-overlay').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('controls-overlay').style.display = 'none';
            tl.play();
        }, 800);
    }

    function downloadThis() {
        const html = `<!DOCTYPE html>
<html lang="es">
${document.head.outerHTML}
${document.body.outerHTML}
</html>`;
        const blob = new Blob([html], {type: 'text/html'});
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'animacion_colgas_resiliencia.html';
        a.click();
        window.URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
