                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MARCAS / CLIENTES */}
                    <Section id="clientes" className="bg-[#050505] border-t border-slate-800">
                        <div className="text-center mb-12">

                    {/* FOOTER */}
                    <footer className="py-16 px-6 border-t border-slate-800 text-center text-slate-500 text-sm bg-deep-black">
