<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Strategy Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; }

        /* Animaciones personalizadas para replicar animate-in de React */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes bounceSlow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }

        .animate-fade-in { animation: fadeIn 0.7s ease-out forwards; }
        .animate-slide-in { animation: slideInRight 0.5s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 0.5s ease-out forwards; }
        .animate-bounce-slow { animation: bounceSlow 2s infinite ease-in-out; }
        
        /* Scrollbar oculta para limpieza visual */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen bg-white text-black selection:bg-black selection:text-white flex flex-col relative overflow-hidden">

    <!-- TRANSITION OVERLAY -->

            <img src="https://i.postimg.cc/dV4ZFJQV/evolution-global-logo.jpg" alt="Evolution Global" class="w-48 md:w-64 animate-pulse">
            <p class="mt-4 text-gray-400 text-sm tracking-widest uppercase animate-pulse">Cargando Propuesta...</p>

    </div>

    <!-- HEADER -->

                icon: "package",

                summary: "Una narrativa transmedia que comienza días antes del juego. Utilizamos la curiosidad natural sobre 'qué hay en la caja' para garantizar un pico de audiencia (hype) y participación masiva durante la transmisión en vivo.",

                    durante: "Experiencia VIP: Despliegue en vivo. El jugador percibe exclusividad y confianza al ver la marca del operador en todo el entorno.",

                }
            },
            {
                id: 6,

        ];

        // --- STATE ---
        let state = {
            activeView: 'intro', // intro, comparison, cards, nextSteps
            selectedCardId: null,
            showTransition: false
        };

        const LOGO_GLOBAL = "https://i.postimg.cc/dV4ZFJQV/evolution-global-logo.jpg";

        // --- RENDER FUNCTIONS ---

        function updateProgress() {
            const bar = document.getElementById('progress-bar');
            let width = 25;
            if (state.showTransition) {
                width = 75;
            } else {
                switch(state.activeView) {
                    case 'intro': width = 25; break;
                    case 'comparison': width = 50; break;
                    case 'cards': width = 75; break;
                    case 'nextSteps': width = 100; break;
                }
            }
            bar.style.width = `${width}%`;
        }

        function renderNav() {
            const nav = document.getElementById('main-nav');
            if (state.activeView === 'intro' || state.showTransition) {
                nav.innerHTML = '';
                return;
            }

            const views = [
                { id: 'comparison', label: 'Estrategia' },
                { id: 'cards', label: 'Marketplace' },
                { id: 'nextSteps', label: 'Cierre' }
            ];

            nav.innerHTML = views.map(v => `
                <button 
                    onclick="navigateTo('${v.id}')"
                    class="px-4 py-2 text-sm font-medium transition-all duration-300 border-b-2 ${state.activeView === v.id ? 'border-black text-black' : 'border-transparent text-gray-400 hover:text-gray-600'}"
                >
                    ${v.label}
                </button>
            `).join('');
        }

        function renderIntro() {

                        </p>
                        <p>

                        </p>
                    </div>
                    <button

                        <!-- Left -->

                            <div class="flex items-center gap-3 mb-6">

                                    <div>
                                        <span class="font-bold text-gray-800 block">2. Alta Capacidad Operativa</span>
                                        <span class="text-sm">Tienen la sede en Medellín con más de 80 crupiers.</span>
                                    </div>
                                </div>
                                <div class="flex items-start gap-3 text-gray-600">
                                    <i data-lucide="layers" class="w-5 h-5 mt-1 text-gray-800"></i>
                                    <div>

                                </div>
                            </div>

                            <div class="w-12 h-12 rounded-full bg-black text-white flex items-center justify-center font-bold text-3xl shadow-lg z-10 hover:rotate-90 transition-transform duration-500">+</div>

                            <div class="flex items-center gap-3 mb-6 relative z-10">
                                <div class="p-2 bg-black text-white rounded-lg"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
                                <h3 class="text-xl font-bold text-black">Objetivo: Consolidar Livespins</h3>
                            </div>
                            
                            <div class="flex flex-col gap-6 mt-auto relative z-10">
                                <div class="flex items-start gap-3 text-black">
                                    <i data-lucide="users" class="w-5 h-5 mt-1"></i>
                                    <div>
                                        <span class="font-bold block">1. El Jugador como Aliado</span>
                                        <span class="text-sm text-gray-600">Generar demanda orgánica del nuevo producto.</span>
                                    </div>
                                </div>
                                <div class="flex items-start gap-3 text-black">
                                    <i data-lucide="smile" class="w-5 h-5 mt-1"></i>

                                        <span class="font-bold block">2. Humanización de la Marca</span>
                                        <span class="text-sm text-gray-600">A través de influencers o hosts carismáticos.</span>
                                    </div>
                                </div>
                                <div class="flex items-start gap-3 text-black">

        function renderCards() {

                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 mb-6 flex items-start gap-3">

                                <h4 class="font-bold text-sm uppercase tracking-wider text-black mb-1">Durante</h4>
                                <p class="text-sm text-gray-900 font-medium leading-relaxed">${card.phases.durante}</p>
                            </div>
                            <div class="relative pl-8 border-l-2 border-gray-100">
                                <div class="absolute left-[-9px] top-0 bg-gray-100 text-gray-500 rounded-full p-1"><i data-lucide="check-circle" class="w-3 h-3"></i></div>
                                <h4 class="font-bold text-sm uppercase tracking-wider text-gray-400 mb-1">El Post</h4>
                                <p class="text-sm text-gray-700 leading-relaxed">${card.phases.post}</p>
                            </div>

                        <div class="mt-auto bg-gray-50 p-5 rounded-xl">

                            onclick="navigateTo('nextSteps')"
                            class="mt-4 md:mt-0 flex items-center gap-2 bg-black text-white px-6 py-2 rounded-full font-medium hover:bg-gray-800 transition-all"

                            Definir siguientes pasos <i data-lucide="arrow-right" class="w-4 h-4"></i>

        function renderNextSteps() {
            return `
                <div class="flex flex-col items-center justify-center h-full text-center animate-fade-in px-4 py-12">
                    <div class="mb-8 p-6 bg-black text-white rounded-full shadow-2xl">
                        <i data-lucide="flag" class="w-12 h-12"></i>
                    </div>
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tighter text-black mb-8">

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl w-full mb-12 text-left">
                        <div class="p-6 bg-gray-50 rounded-xl border border-gray-100 hover:border-black transition-colors">

                        <div class="p-6 bg-gray-50 rounded-xl border border-gray-100 hover:border-black transition-colors">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="p-2 bg-white rounded-full shadow-sm"><i data-lucide="clipboard-list" class="w-5 h-5"></i></div>
                                <div class="font-bold text-lg">2. Selección</div>
                            </div>
                            <p class="text-gray-600 text-sm">¿Qué ideas del Marketplace vamos a priorizar?</p>
                        </div>
                        <div class="p-6 bg-gray-50 rounded-xl border border-gray-100 hover:border-black transition-colors">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="p-2 bg-white rounded-full shadow-sm"><i data-lucide="bar-chart-3" class="w-5 h-5"></i></div>
                                <div class="font-bold text-lg">3. Métricas</div>
                            </div>
                            <p class="text-gray-600 text-sm">¿Qué KPIs actuales usaremos como línea base?</p>
                        </div>
                    </div>

                    <div class="max-w-2xl bg-black text-white p-8 rounded-2xl shadow-xl relative overflow-hidden group cursor-default">
                        <div class="relative z-10">
                            <h3 class="text-2xl font-bold mb-4">Objetivo: Montar el Piloto</h3>
                            <p class="text-lg font-light opacity-90 leading-relaxed">
                                Con estos insumos, armaremos la <strong class="font-bold text-white">estrategia interna</strong> y diseñaremos la <strong class="font-bold text-white">propuesta final para el operador</strong>.
                            </p>
                        </div>
                        <div class="absolute top-0 right-0 w-32 h-32 bg-gray-800 rounded-bl-full -mr-16 -mt-16 opacity-50 group-hover:scale-110 transition-transform duration-700"></div>
                    </div>
                    
                    <div class="mt-8 text-sm text-gray-400">
                        Juntos vamos a cambiar las reglas del juego.
                    </div>
                </div>
            `;
        }

        // --- CONTROLLER ---

        function render() {
            const container = document.getElementById('main-container');
            container.innerHTML = '';
            
            if (state.activeView === 'intro') container.innerHTML = renderIntro();
            else if (state.activeView === 'comparison') container.innerHTML = renderComparison();
            else if (state.activeView === 'cards') container.innerHTML = renderCards();
            else if (state.activeView === 'nextSteps') container.innerHTML = renderNextSteps();

            renderNav();
            updateProgress();
            lucide.createIcons();
        }

        function navigateTo(view) {
            state.activeView = view;
            state.selectedCardId = null; // Reset selection on nav
            render();
        }

        function selectCard(id) {
            state.selectedCardId = id;
            render();
        }

        function startTransitionProposal() {
            state.showTransition = true;
            document.getElementById('transition-overlay').classList.remove('hidden');
            updateProgress();

            setTimeout(() => {
                state.activeView = 'cards';
                state.showTransition = false;
                document.getElementById('transition-overlay').classList.add('hidden');
                render();
            }, 2500);
        }

        // Initial Render
        window.onload = () => {
            render();
        }

    </script>
</body>
</html>
