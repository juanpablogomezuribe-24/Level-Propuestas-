<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Suárez - Video de Campaña Oficial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes progressLine {
            from { width: 0%; }
            to { width: 100%; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideInRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-profile { animation: fadeInScale 0.8s ease-out forwards; }
        
        /* Animaciones de elementos internos */
        .vote-step { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
        .prop-card { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }

        body { background-color: #0f172a; overflow: hidden; }
        .full-slide-height { height: 100%; display: flex; flex-direction: column; align-items: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, color = "currentColor", size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size, color: color }} className={className}></i>;
        };

        const App = () => {
            const [step, setStep] = useState(0);
            const totalSteps = 6;
            
            // Tiempos ajustados: Portada (3s), Voto (6s), Manifiesto (4s), Compromisos I (8.5s), Compromisos II (8.5s), Cierre (5s)
            const durations = [3000, 6000, 4000, 8500, 8500, 5000];

            useEffect(() => {
                const timer = setTimeout(() => {
                    setStep((prev) => (prev + 1) % totalSteps);
                }, durations[step]);
                return () => clearTimeout(timer);
            }, [step]);

            const ProgressHeader = () => (
                <div className="flex gap-1.5 px-4 pt-4 pb-2 bg-slate-900 z-50 relative">
                    {[...Array(totalSteps)].map((_, i) => (
                        <div key={i} className="h-1 flex-1 bg-slate-700 rounded-full overflow-hidden">
                            {i === step && (
                                <div 
                                    className="h-full bg-pink-500" 
                                    style={{ animation: `progressLine ${durations[i]}ms linear forwards` }}
                                ></div>
                            )}
                            {i < step && <div className="h-full bg-pink-500 w-full"></div>}
                        </div>
                    ))}
                </div>
            );

            return (
                <div className="min-h-screen bg-white font-sans text-slate-800 max-w-md mx-auto shadow-2xl relative flex flex-col overflow-hidden">
                    <ProgressHeader />

                    <div className="flex-1 relative flex flex-col">
                        
                        {/* 0: PORTADA */}
                        {step === 0 && (
                            <div className="animate-profile h-full flex flex-col justify-center">
                                <div className="flex h-2 w-full absolute top-0 left-0 z-20">
                                    <div className="bg-yellow-400 flex-1"></div>
                                    <div className="bg-blue-600 flex-1"></div>
                                    <div className="bg-red-600 flex-1"></div>
                                </div>
                                <div className="px-10 pt-16 flex flex-col items-center">
                                    <div className="relative mb-12">
                                        <div className="w-64 h-64 rounded-full border-8 border-pink-500 overflow-hidden shadow-2xl relative z-10">
                                            <img src="https://i.postimg.cc/QNTfcbG0/SOL-(5).png" className="w-full h-full object-cover" alt="Sol Suárez" />
                                        </div>
                                        <div className="absolute -inset-8 bg-pink-50 rounded-full blur-3xl opacity-40"></div>
                                    </div>
                                    <div className="text-center">
                                        <h1 className="text-5xl font-black text-blue-700 tracking-tighter mb-2 italic text-center leading-none">SOL SUÁREZ</h1>
                                        <p className="text-xl font-bold text-slate-400 uppercase tracking-[0.3em] mb-8 text-center">Sol por Bogotá</p>
                                        <div className="h-1.5 w-24 bg-pink-500 mb-8 mx-auto"></div>
                                        <p className="text-slate-500 font-bold text-xs uppercase tracking-[0.2em] leading-loose text-center">
                                            Economía clara <br/> Decisiones responsables <br/> Resultados reales
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 1: CÓMO VOTAR (6s) - CORRECCIÓN: PASOS MINI Y IMAGEN MAXIMIZADA */}
                        {step === 1 && (
                            <div className="animate-slide-in h-full flex flex-col p-4 bg-slate-50">
                                <h2 className="text-xl font-black text-slate-800 italic uppercase mb-3 border-l-6 border-yellow-400 pl-3">¿Cómo votar por Sol?</h2>
                                
                                <div className="flex-1 flex flex-col min-h-0">
                                    {/* Pasos muy pequeños y subidos */}
                                    <div className="grid grid-cols-1 gap-1.5 mb-3 shrink-0">
                                        <div className="vote-step bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-100 flex items-center gap-3" style={{animationDelay: '0.4s'}}>
                                            <div className="w-5 h-5 bg-blue-700 text-white rounded-full flex items-center justify-center font-black shrink-0 text-[9px]">1</div>
                                            <p className="font-bold text-[9px] uppercase text-slate-600 leading-tight">Pide el tarjetón de la Cámara</p>
                                        </div>
                                        <div className="vote-step bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-100 flex items-center gap-3" style={{animationDelay: '1.0s'}}>
                                            <div className="w-5 h-5 bg-blue-700 text-white rounded-full flex items-center justify-center font-black shrink-0 text-[9px]">2</div>
                                            <p className="font-bold text-[9px] uppercase text-slate-600 leading-tight">Busca el logo Ciudadanos Renovemos</p>
                                        </div>
                                        <div className="vote-step bg-pink-500 text-white px-3 py-2 rounded-lg shadow-md border-b-2 border-pink-700 flex items-center gap-3" style={{animationDelay: '1.6s'}}>
                                            <div className="w-6 h-6 bg-white text-pink-500 rounded-full flex items-center justify-center font-black text-xs shrink-0">3</div>
                                            <p className="font-black text-[10px] uppercase italic tracking-wider leading-tight">Marca el número <span className="text-sm">108</span></p>
                                        </div>
                                    </div>

                                    {/* Imagen centrada que ocupa todo el espacio restante */}
                                    <div className="vote-step flex-1 flex items-center justify-center overflow-hidden" style={{animationDelay: '2.4s'}}>
                                        <img 
                                            src="https://i.postimg.cc/rsBGY7Bz/SOL-ENE28-1.png" 
                                            className="max-h-full w-auto object-contain rounded-xl shadow-2xl border-2 border-white transform rotate-1" 
                                            alt="Tarjetón de Votación Completo" 
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2: MANIFIESTO (4s) */}
                        {step === 2 && (
                            <div className="animate-slide-in h-full flex flex-col">
                                <div className="h-[45%] overflow-hidden relative">
                                    <img src="https://i.postimg.cc/gjCyB1CB/SOL-POR-BOGOTA-1.jpg" className="w-full h-full object-cover" alt="Sol por Bogotá" />
                                </div>
                                <div className="flex-1 p-10 flex flex-col justify-center text-center bg-white">
                                    <h2 className="text-3xl font-black text-pink-600 leading-tight uppercase italic mb-8 text-center">Apostar por Sol es invertir en Colombia</h2>
                                    <div className="h-1 w-20 bg-blue-600 mx-auto mb-8 text-center"></div>
                                    <p className="text-lg text-slate-600 leading-relaxed font-medium text-left">
                                        Sol entiende <strong>el problema, la solución y, sobre todo, cómo financiarla.</strong> Su trayectoria respalda una visión basada en el rigor técnico.
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* 3: COMPROMISOS I (8.5s) */}
                        {step === 3 && (
                            <div className="animate-slide-in h-full flex flex-col bg-white">
                                <div className="bg-pink-500 p-6 text-white text-center">
                                    <h2 className="text-3xl font-black italic uppercase leading-none">Compromisos (I)</h2>
                                    <p className="text-xs font-bold mt-2 uppercase tracking-widest text-pink-100">Cámara Bogotá 108</p>
                                </div>
                                <div className="flex-1 flex flex-col justify-evenly p-6 gap-4">
                                    {[
                                        {t: "Educación Financiera", d: "Educación obligatoria para manejar mejor el dinero y crear patrimonio.", i: "book-open", s: '0.5s'},
                                        {t: "Impulso a Mipymes", d: "Impuestos simples, menos trámites y crédito real para generar empleo.", i: "trending-up", s: '1.5s'},
                                        {t: "Emprendimiento", d: "Capital y acompañamiento para que el talento colombiano tenga éxito.", i: "rocket", s: '2.5s'},
                                        {t: "Libertad de Prensa", d: "Apoyo financiero a medios públicos, comunitarios y digitales.", i: "mic-2", s: '3.5s'},
                                        {t: "Control Político", d: "Datos y evidencia para que las reformas generen bienestar real.", i: "bar-chart-3", s: '4.5s'}
                                    ].map((p, i) => (
                                        <div key={i} className="prop-card bg-slate-50 p-5 rounded-3xl border-2 border-slate-100 shadow-md flex items-center gap-5" style={{animationDelay: p.s}}>
                                            <div className="w-12 h-12 bg-blue-700 text-white rounded-full flex items-center justify-center shrink-0 shadow-lg"><Icon name={p.i} size={24} /></div>
                                            <div className="text-left"><h4 className="font-black text-[12px] uppercase text-blue-900 leading-tight mb-1">{p.t}</h4><p className="text-[11px] text-slate-500 leading-snug">{p.d}</p></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4: COMPROMISOS II (8.5s) */}
                        {step === 4 && (
                            <div className="animate-slide-in h-full flex flex-col bg-white">
                                <div className="bg-pink-500 p-6 text-white text-center">
                                    <h2 className="text-3xl font-black italic uppercase leading-none">Compromisos (II)</h2>
                                    <p className="text-xs font-bold mt-2 uppercase tracking-widest text-pink-100">Cámara Bogotá 108</p>
                                </div>
                                <div className="flex-1 flex flex-col justify-evenly p-6 gap-4">
                                    {[
                                        {t: "Vivienda Digna", d: "Alternativas de compra sin cuota inicial para tu hogar propio.", i: "home", s: '0.5s'},
                                        {t: "Sector Energético", d: "Eliminaremos sobretasas para atraer inversión y generar empleo.", i: "zap", s: '1.5s'},
                                        {t: "Activos Digitales", d: "Reglamentación para avanzar al ritmo de la economía mundial.", i: "globe", s: '2.5s'},
                                        {t: "Reactivación Económica", d: "Inversión y empleo con visión técnica a largo plazo.", i: "line-chart", s: '3.5s'},
                                        {t: "Bogotá Destrabada", d: "Aseguraremos proyectos de agua, energía y movilidad para la ciudad.", i: "map-pin", s: '4.5s'}
                                    ].map((p, i) => (
                                        <div key={i} className="prop-card bg-slate-50 p-5 rounded-3xl border-2 border-slate-100 shadow-md flex items-center gap-5" style={{animationDelay: p.s}}>
                                            <div className="w-12 h-12 bg-blue-700 text-white rounded-full flex items-center justify-center shrink-0 shadow-lg"><Icon name={p.i} size={24} /></div>
                                            <div className="text-left"><h4 className="font-black text-[12px] uppercase text-blue-900 leading-tight mb-1">{p.t}</h4><p className="text-[11px] text-slate-500 leading-snug">{p.d}</p></div>
                                        </div>
                                    ))}
                                    <div className="text-center pt-2"><p className="text-pink-600 font-black text-sm underline leading-tight">www.solsuarezjaramillo.com</p></div>
                                </div>
                            </div>
                        )}

                        {/* 5: CIERRE (5s) */}
                        {step === 5 && (
                            <div className="animate-slide-in h-full flex flex-col bg-white">
                                <div className="bg-slate-800 p-8 text-white text-center italic border-b-8 border-pink-500">
                                    <h3 className="text-2xl font-black uppercase leading-tight mb-2 text-center leading-tight">Subámosle el nivel al debate en el Congreso</h3>
                                    <p className="text-yellow-400 font-bold text-sm tracking-tighter uppercase italic text-center">Porque si conoces tu economía tienes el poder</p>
                                </div>
                                <div className="flex-1 p-6 flex flex-col justify-center items-center text-center">
                                    <div className="rounded-3xl overflow-hidden shadow-2xl border-4 border-slate-100 max-w-[85%] transform rotate-1 mb-10">
                                        <img src="https://i.postimg.cc/LX0McV4c/Whats-App-Image-2026-02-23-at-6-15-49-PM.jpg" className="w-full h-auto" alt="Vota por Sol" />
                                    </div>
                                    <div className="animate-pulse px-6">
                                        <p className="text-sm font-black text-slate-400 uppercase tracking-widest mb-3 text-center">Si me apoyas,</p>
                                        <p className="text-pink-600 font-black text-2xl uppercase italic leading-tight text-center">
                                            Comparte mi <br/> tarjeta digital
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>

                    {/* PIE DE PÁGINA LEGAL */}
                    <div className="bg-slate-900 px-8 py-5 text-center border-t border-slate-800 z-50">
                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-widest leading-tight text-center">
                            Publicidad Política Pagada<br/>
                            <span className="text-pink-500 font-bold">Ciudadanos Renovemos</span> | Cámara por Bogotá 108
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
